<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>teerzobot dungeon</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: transparent;
            overflow: hidden;
            color: #fff;
            font: 16px/1.3 "Trebuchet MS", "Segoe UI", sans-serif;
        }
        #stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 640px;
            height: 480px;
            background: #090807;
            overflow: hidden;
            container-type: size;
            container-name: dungeon;
            --ui-scale: 1;
            font-size: calc(16px * var(--ui-scale));
        }
        #stage.anchor-top-left { top: 0; left: 0; right: auto; bottom: auto; }
        #stage.anchor-top-right { top: 0; right: 0; left: auto; bottom: auto; }
        #stage.anchor-bottom-left { bottom: 0; left: 0; top: auto; right: auto; }
        #stage.anchor-bottom-right { bottom: 0; right: 0; top: auto; left: auto; }
        html.paused,
        html.paused body,
        html.paused #stage {
            background: transparent;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            opacity: 1;
        }
        html.paused canvas,
        html.paused #hud {
            opacity: 0;
        }
        #hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
            text-shadow: 0 1px 2px #000, 0 0 8px #000;
        }
        #top {
            position: absolute;
            top: clamp(0.35em, 3.2cqh, 1.1em);
            left: clamp(0.5em, 2.4cqw, 1.25em);
            right: clamp(0.5em, 2.4cqw, 1.25em);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5em;
        }
        #floor, #mode, #last, #votes {
            background: rgba(0, 0, 0, 0.62);
            border-radius: 0.5em;
        }
        #floor {
            display: flex;
            align-items: baseline;
            gap: 0.35em;
            white-space: nowrap;
            padding: 0.35em 0.6em;
            font-size: 0.9em;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        #floor strong {
            display: inline;
            font-size: clamp(1.1em, 3.8cqw, 1.5em);
            letter-spacing: 0.02em;
            font-weight: 700;
        }
        #mode {
            padding: 0.35em 0.6em;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.95em;
            font-weight: 700;
            text-align: right;
            background: rgba(180, 40, 28, 0.78);
        }
        #mode strong {
            display: block;
            font-size: 1em;
            letter-spacing: 0.08em;
        }
        #mode-hint {
            display: none;
            margin-top: 0.12em;
            font-size: 0.68em;
            font-weight: 700;
            letter-spacing: 0.04em;
            opacity: 0.92;
            text-transform: uppercase;
        }
        #mode.democracy {
            background: rgba(20, 90, 160, 0.82);
        }
        #mode.autoplay {
            background: rgba(196, 132, 24, 0.92);
            box-shadow: 0 0 0.75em rgba(226, 184, 74, 0.45);
            animation: autoplayPulse 1.6s ease-in-out infinite;
        }
        #mode.autoplay #mode-hint {
            display: block;
        }
        @keyframes autoplayPulse {
            0%, 100% { box-shadow: 0 0 0.5em rgba(226, 184, 74, 0.3); }
            50% { box-shadow: 0 0 1.1em rgba(226, 184, 74, 0.75); }
        }
        #hud.autoplay #vignette {
            background: radial-gradient(ellipse at center, transparent 42%, rgba(48, 24, 0, 0.58) 100%);
        }
        #last {
            position: absolute;
            left: clamp(0.5em, 2.4cqw, 1.25em);
            bottom: clamp(0.5em, 4cqh, 1.4em);
            font-size: clamp(0.95em, 2.8cqw, 1.25em);
            font-weight: 700;
            max-width: 54%;
            padding: 0.35em 0.6em;
        }
        #last span {
            opacity: 0.92;
            font-weight: 700;
            font-size: 0.88em;
        }
        #votes {
            position: absolute;
            right: clamp(0.5em, 2.4cqw, 1.25em);
            bottom: clamp(0.5em, 3.6cqh, 1.25em);
            width: min(15em, 38cqw);
            padding: clamp(0.35em, 1.4cqh, 0.75em) clamp(0.5em, 1.2cqw, 0.9em);
            display: none;
        }
        #votes.open {
            display: block;
        }
        #votes h2 {
            margin: 0 0 0.4em;
            font-size: 0.8em;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .vote {
            display: grid;
            grid-template-columns: 2.8em 1fr 1.5em;
            gap: 0.4em;
            align-items: center;
            margin-top: 0.25em;
            font-size: 0.95em;
            font-weight: 700;
        }
        .bar {
            height: clamp(0.35em, 1.4cqh, 0.5em);
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.18);
            overflow: hidden;
        }
        .bar i {
            display: block;
            height: 100%;
            width: 0;
            background: #7ce0ff;
            transition: width 0.2s ease;
        }
        #vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, 0.55) 100%);
        }
        #help {
            position: absolute;
            top: clamp(0.35em, 3.2cqh, 1.1em);
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.9;
            font-size: 0.85em;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            white-space: nowrap;
            padding: 0.35em 0.6em;
            border-radius: 0.5em;
            background: rgba(0, 0, 0, 0.62);
        }
        @container dungeon (max-width: 680px) {
            #help { display: none; }
        }
        @container dungeon (max-height: 500px) {
            #help { display: none; }
        }
        #transition {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #transition.out {
            opacity: 1;
        }
        #transition-msg {
            opacity: 0;
            color: #f3e6c8;
            font-size: clamp(1.1em, 5cqw, 2.1em);
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 0 1.1em rgba(226, 184, 74, 0.45);
            transition: opacity 0.35s ease;
        }
        #transition.title #transition-msg {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="stage" class="anchor-top-left">
    <div id="hud">
        <div id="vignette"></div>
        <div id="top">
            <div id="floor">Floor <strong>0</strong></div>
            <div id="mode"><strong id="mode-name">Anarchy</strong><span id="mode-hint"></span></div>
        </div>
        <div id="help">!up !down !left !right</div>
        <div id="last"><span>Waiting for chat</span></div>
        <div id="votes">
            <h2 id="vote-title">Democracy</h2>
            <div class="vote"><span>!up</span><div class="bar"><i id="bar-up"></i></div><b id="n-up">0</b></div>
            <div class="vote"><span>!down</span><div class="bar"><i id="bar-down"></i></div><b id="n-down">0</b></div>
            <div class="vote"><span>!left</span><div class="bar"><i id="bar-left"></i></div><b id="n-left">0</b></div>
            <div class="vote"><span>!right</span><div class="bar"><i id="bar-right"></i></div><b id="n-right">0</b></div>
        </div>
        <div id="transition"><div id="transition-msg">Entering Level 0</div></div>
    </div>
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { RectAreaLightUniformsLib } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/lights/RectAreaLightUniformsLib.js';

        RectAreaLightUniformsLib.init();

        const params = new URLSearchParams(location.search);
        const preview = params.has('preview');
        const CELL = 1;
        const EYE = 0.52;
        const WALL_H = 1.55;
        const YAWS = [0, -Math.PI / 2, Math.PI, Math.PI / 2];

        const floorEl = document.querySelector('#floor strong');
        const hudEl = document.getElementById('hud');
        const stageEl = document.getElementById('stage');
        const modeEl = document.getElementById('mode');
        const modeNameEl = document.getElementById('mode-name');
        const modeHintEl = document.getElementById('mode-hint');
        const helpEl = document.getElementById('help');
        const lastEl = document.getElementById('last');
        const votesEl = document.getElementById('votes');
        const voteTitleEl = document.getElementById('vote-title');
        const transitionEl = document.getElementById('transition');
        const transitionMsgEl = document.getElementById('transition-msg');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x090807);
        scene.fog = new THREE.FogExp2(0x090807, 0.42);

        const camera = new THREE.PerspectiveCamera(90, 640 / 480, 0.05, 80);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(640, 480);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.BasicShadowMap;
        document.getElementById('stage').prepend(renderer.domElement);

        const ambient = new THREE.AmbientLight(0x2a241c, 0.4);
        scene.add(ambient);
        const torch = new THREE.PointLight(0xffd6a0, 2.4, 8, 1.6);
        camera.add(torch);
        scene.add(camera);

        const pillarMat = new THREE.MeshStandardMaterial({
            color: 0x9a9084,
            roughness: 0.72,
            metalness: 0.08,
        });
        const goldMat = new THREE.MeshStandardMaterial({
            color: 0xe2b84a,
            emissive: 0x6a4808,
            emissiveIntensity: 0.55,
            roughness: 0.28,
            metalness: 0.9,
        });

        const exitMesh = new THREE.Group();
        const pillarBase = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.24, 0.06, 12), pillarMat);
        pillarBase.position.y = 0.03;
        const pillarShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 0.34, 12), pillarMat);
        pillarShaft.position.y = 0.23;
        const pillarCap = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.12, 0.06, 12), pillarMat);
        pillarCap.position.y = 0.43;
        for (const part of [pillarBase, pillarShaft, pillarCap]) {
            part.castShadow = true;
            exitMesh.add(part);
        }

        const exitCrown = new THREE.Group();
        exitCrown.position.y = 0.48;
        const crownBand = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.125, 0.07, 12), goldMat);
        crownBand.position.y = 0.02;
        exitCrown.add(crownBand);
        const spikeGeo = new THREE.ConeGeometry(0.032, 0.15, 6);
        for (let i = 0; i < 5; i++) {
            const spike = new THREE.Mesh(spikeGeo, goldMat);
            const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
            spike.position.set(Math.cos(a) * 0.09, 0.12, Math.sin(a) * 0.09);
            spike.castShadow = true;
            exitCrown.add(spike);
        }
        const centerSpike = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.2, 6), goldMat);
        centerSpike.position.y = 0.16;
        centerSpike.castShadow = true;
        exitCrown.add(centerSpike);
        const jewel = new THREE.Mesh(new THREE.SphereGeometry(0.028, 10, 8), goldMat);
        jewel.position.y = 0.27;
        exitCrown.add(jewel);
        exitMesh.add(exitCrown);
        scene.add(exitMesh);

        const exitSpot = new THREE.SpotLight(0xffd078, 28, 6.5, Math.PI / 6, 0.4, 1.15);
        exitSpot.castShadow = true;
        exitSpot.shadow.mapSize.set(256, 256);
        exitSpot.shadow.camera.near = 0.1;
        exitSpot.shadow.camera.far = 7;
        const exitTarget = new THREE.Object3D();
        exitSpot.target = exitTarget;
        scene.add(exitSpot);
        scene.add(exitTarget);

        function makeSpotBeam(topR, bottomR, height, opacity) {
            const geo = new THREE.CylinderGeometry(topR, bottomR, height, 24, 8, true);
            const pos = geo.attributes.position;
            const colors = new Float32Array(pos.count * 3);
            const tint = new THREE.Color(0xffe19a);
            for (let i = 0; i < pos.count; i++) {
                const y = pos.getY(i);
                const fade = Math.max(0, (y / height + 0.5) ** 1.6);
                colors[i * 3] = tint.r * fade;
                colors[i * 3 + 1] = tint.g * fade;
                colors[i * 3 + 2] = tint.b * fade;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const mat = new THREE.MeshBasicMaterial({
                vertexColors: true,
                transparent: true,
                opacity,
                side: THREE.DoubleSide,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.renderOrder = 2;
            mesh.frustumCulled = false;
            return mesh;
        }

        const spotAngle = Math.PI / 6;
        const beamTop = WALL_H - 0.05;
        const beamBottom = 0.05;
        const beamHeight = beamTop - beamBottom;
        const beamRadius = Math.tan(spotAngle) * beamHeight;
        const exitBeam = makeSpotBeam(0.025, beamRadius, beamHeight, 0.2);
        const exitBeamCore = makeSpotBeam(0.012, beamRadius * 0.42, beamHeight, 0.32);
        exitBeam.position.y = (beamTop + beamBottom) / 2;
        exitBeamCore.position.y = (beamTop + beamBottom) / 2;
        exitMesh.add(exitBeam);
        exitMesh.add(exitBeamCore);

        function makeStoneCanvas() {
            const size = 32;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2a2622';
            ctx.fillRect(0, 0, size, size);

            const palettes = [
                [118, 104, 90],
                [96, 86, 74],
                [132, 116, 98],
                [84, 76, 66],
                [108, 96, 82],
                [124, 112, 96],
                [90, 82, 70],
            ];
            const brickW = 16;
            const brickH = 8;
            const grout = 1;

            function paintBrick(x, y, pal, seed) {
                const shade = 0.82 + (seed % 8) * 0.03;
                const r = Math.min(255, pal[0] * shade);
                const g = Math.min(255, pal[1] * shade);
                const b = Math.min(255, pal[2] * shade);
                for (const ox of [0, size, -size]) {
                    for (const oy of [0, size, -size]) {
                        const dx = x + ox;
                        const dy = y + oy;
                        if (dx >= size || dy >= size || dx + brickW - grout <= 0 || dy + brickH - grout <= 0) {
                            continue;
                        }
                        ctx.fillStyle = `rgb(${r | 0},${g | 0},${b | 0})`;
                        ctx.fillRect(dx + grout, dy + grout, brickW - grout, brickH - grout);
                        ctx.fillStyle = 'rgba(0,0,0,0.18)';
                        ctx.fillRect(dx + grout, dy + brickH - 1, brickW - grout, 1);
                        ctx.fillStyle = 'rgba(255,255,255,0.08)';
                        ctx.fillRect(dx + grout, dy + grout, brickW - grout, 1);
                    }
                }
            }

            let row = 0;
            for (let y = 0; y < size; y += brickH) {
                const offset = (row % 2) * (brickW / 2);
                for (let x = -offset; x < size; x += brickW) {
                    const seed = Math.abs((x * 13 + y * 7 + row * 17) | 0);
                    paintBrick(x, y, palettes[seed % palettes.length], seed);
                }
                row += 1;
            }

            const img = ctx.getImageData(0, 0, size, size);
            for (let i = 0; i < img.data.length; i += 4) {
                const n = ((i * 17) % 9) - 4;
                img.data[i] = Math.max(0, Math.min(255, img.data[i] + n));
                img.data[i + 1] = Math.max(0, Math.min(255, img.data[i + 1] + n));
                img.data[i + 2] = Math.max(0, Math.min(255, img.data[i + 2] + n));
            }
            ctx.putImageData(img, 0, 0);
            return canvas;
        }

        function drawVines(ctx, size) {
            const stems = ['#1d4a1a', '#245820', '#2f6b28'];
            const leaves = ['#2e6e28', '#3d8a32', '#52a83e', '#6cbc4a'];

            function px(x, y, color) {
                const dx = ((x % size) + size) % size;
                if (y < 0 || y >= size) {
                    return;
                }
                ctx.fillStyle = color;
                ctx.fillRect(dx, y, 1, 1);
            }

            function leaf(x, y, seed) {
                px(x, y, leaves[seed % leaves.length]);
                if (seed % 2 === 0) {
                    px(x + 1, y, leaves[(seed + 1) % leaves.length]);
                }
                if (seed % 3 !== 1) {
                    px(x, y + 1, leaves[(seed + 2) % leaves.length]);
                }
                if (seed % 4 === 0) {
                    px(x - 1, y, '#245820');
                }
                if (seed % 5 === 0) {
                    px(x + 1, y - 1, '#7ad055');
                }
            }

            const vines = [
                { x: 3, lean: 1, len: 32 },
                { x: 11, lean: -1, len: 26 },
                { x: 18, lean: 1, len: 30 },
                { x: 27, lean: -1, len: 22 },
            ];
            for (const vine of vines) {
                let x = vine.x;
                for (let y = 0; y < vine.len; y++) {
                    px(x, y, stems[(x + y) % stems.length]);
                    px(x, y + 1, stems[(x + y + 1) % stems.length]);
                    if ((y + vine.x) % 3 === 0) {
                        leaf(x + vine.lean, y, x * 5 + y);
                    }
                    if ((y + vine.x) % 4 === 0) {
                        leaf(x - vine.lean, y + 1, y * 7 + vine.x);
                    }
                    if (y > 2 && (y * 3 + vine.x) % 5 === 0) {
                        x += vine.lean;
                    }
                }
            }

            for (let i = 0; i < 10; i++) {
                leaf(4 + ((i * 11) % 24), 2 + ((i * 5) % 8), i * 13);
            }
        }

        function canvasToTexture(canvas, repeatX = 1, repeatY = 2) {
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.repeat.set(repeatX, repeatY);
            tex.needsUpdate = true;
            return tex;
        }

        function makeVineCanvas() {
            const canvas = makeStoneCanvas();
            drawVines(canvas.getContext('2d'), canvas.width);
            return canvas;
        }

        function drawCracks(ctx, size) {
            function px(x, y, color) {
                const dx = ((x % size) + size) % size;
                if (y < 0 || y >= size) {
                    return;
                }
                ctx.fillStyle = color;
                ctx.fillRect(dx, y, 1, 1);
            }

            function crack(x0, y0, x1, y1, dark, edge) {
                const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
                for (let i = 0; i <= steps; i++) {
                    const t = i / Math.max(1, steps);
                    const x = Math.round(x0 + (x1 - x0) * t);
                    const y = Math.round(y0 + (y1 - y0) * t);
                    const jag = (i % 3 === 0) ? 1 : 0;
                    px(x + jag, y, dark);
                    px(x + jag + 1, y, edge);
                    if (i % 4 === 0) {
                        px(x + jag, y + 1, dark);
                    }
                    if (i % 5 === 2) {
                        px(x + jag - 1, y, edge);
                    }
                }
            }

            const dark = '#14110e';
            const edge = '#3a332c';
            crack(3, 2, 10, 18, dark, edge);
            crack(10, 18, 8, 31, dark, edge);
            crack(18, 1, 28, 14, dark, edge);
            crack(22, 12, 31, 22, dark, edge);
            crack(14, 8, 20, 24, dark, edge);
            crack(1, 22, 12, 28, dark, edge);

            for (let n = 0; n < 18; n++) {
                px((n * 9 + 4) % size, (n * 5 + 11) % size, n % 2 ? dark : '#1c1814');
            }
        }

        function makeCrackedCanvas() {
            const canvas = makeStoneCanvas();
            drawCracks(canvas.getContext('2d'), canvas.width);
            return canvas;
        }

        function makeFloorCanvas(kind) {
            const size = 32;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const grout = kind === 'moss' ? '#1c2a18' : '#1a1613';
            ctx.fillStyle = grout;
            ctx.fillRect(0, 0, size, size);

            const palettes = {
                flag: [[92, 82, 70], [108, 96, 82], [80, 72, 62], [118, 104, 88]],
                worn: [[86, 76, 64], [100, 88, 74], [72, 64, 54], [94, 84, 70]],
                moss: [[78, 80, 62], [90, 86, 68], [70, 76, 58], [102, 94, 72]],
                dark: [[58, 52, 46], [70, 62, 54], [48, 44, 40], [64, 58, 50]],
                gravel: [[84, 74, 62], [96, 86, 72], [74, 66, 56], [108, 96, 80]],
            }[kind];

            const tile = kind === 'gravel' ? 8 : 16;
            const gap = 1;
            let i = 0;
            for (let y = 0; y < size; y += tile) {
                for (let x = 0; x < size; x += tile) {
                    const pal = palettes[(x / tile + (y / tile) * 3 + i) % palettes.length];
                    const shade = 0.86 + ((x * 9 + y * 5 + i * 13) % 7) * 0.03;
                    ctx.fillStyle = `rgb(${(pal[0] * shade) | 0},${(pal[1] * shade) | 0},${(pal[2] * shade) | 0})`;
                    ctx.fillRect(x + gap, y + gap, tile - gap, tile - gap);
                    ctx.fillStyle = 'rgba(255,255,255,0.06)';
                    ctx.fillRect(x + gap, y + gap, tile - gap, 1);
                    ctx.fillStyle = 'rgba(0,0,0,0.16)';
                    ctx.fillRect(x + gap, y + tile - 1, tile - gap, 1);
                    i += 1;
                }
            }

            function px(x, y, color) {
                ctx.fillStyle = color;
                ctx.fillRect(((x % size) + size) % size, ((y % size) + size) % size, 1, 1);
            }

            if (kind === 'worn') {
                const cracks = [
                    [4, 6, 1, 1], [5, 7, 1, 1], [6, 8, 1, 1], [7, 9, 1, 1], [8, 11, 1, 1],
                    [18, 3, 1, 1], [19, 4, 1, 1], [20, 6, 1, 1], [21, 8, 1, 1],
                    [10, 20, 1, 1], [11, 21, 1, 1], [12, 22, 1, 1], [13, 24, 1, 1], [14, 25, 1, 1],
                ];
                for (const [x, y] of cracks) {
                    px(x, y, '#151210');
                    px(x + 1, y, '#2a241e');
                }
            }

            if (kind === 'moss') {
                const moss = ['#2a5c24', '#3d7a32', '#4a8f38', '#1e4a1c'];
                for (let n = 0; n < 70; n++) {
                    const x = (n * 11 + 3) % size;
                    const y = (n * 17 + 5) % size;
                    const onGrout = x % 16 === 0 || y % 16 === 0 || x % 16 === 15 || y % 16 === 15;
                    if (onGrout || n % 4 === 0) {
                        px(x, y, moss[n % moss.length]);
                        if (n % 3 === 0) {
                            px(x + 1, y, moss[(n + 1) % moss.length]);
                        }
                    }
                }
            }

            if (kind === 'gravel') {
                for (let n = 0; n < 40; n++) {
                    px((n * 7) % size, (n * 13) % size, n % 2 ? '#5a4e42' : '#3a322c');
                }
            }

            const img = ctx.getImageData(0, 0, size, size);
            for (let p = 0; p < img.data.length; p += 4) {
                const n = ((p * 13) % 7) - 3;
                img.data[p] = Math.max(0, Math.min(255, img.data[p] + n));
                img.data[p + 1] = Math.max(0, Math.min(255, img.data[p + 1] + n));
                img.data[p + 2] = Math.max(0, Math.min(255, img.data[p + 2] + n));
            }
            ctx.putImageData(img, 0, 0);
            return canvas;
        }

        function lerpAngle(a, b, t) {
            let diff = b - a;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            return a + diff * t;
        }

        function artworkClip(url) {
            const existing = artworkClips.get(url);
            if (existing) {
                return existing;
            }
            const clip = {
                url,
                img: new Image(),
                canvas: document.createElement('canvas'),
                ctx: null,
                texture: null,
                animated: isAnimatedArtwork(url),
                ready: false,
                failed: false,
                waiters: [],
            };
            artworkClips.set(url, clip);
            const img = clip.img;
            img.alt = '';
            img.decoding = 'async';
            img.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px';
            document.body.appendChild(img);
            img.addEventListener('error', () => {
                clip.failed = true;
                for (const apply of clip.waiters) {
                    apply(null);
                }
                clip.waiters = [];
            });
            img.addEventListener('load', () => {
                const max = 512;
                const scale = Math.min(1, max / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
                clip.canvas.width = Math.max(1, Math.round((img.naturalWidth || 1) * scale));
                clip.canvas.height = Math.max(1, Math.round((img.naturalHeight || 1) * scale));
                clip.ctx = clip.canvas.getContext('2d');
                clip.ctx.drawImage(img, 0, 0, clip.canvas.width, clip.canvas.height);
                clip.texture = new THREE.CanvasTexture(clip.canvas);
                clip.texture.colorSpace = THREE.SRGBColorSpace;
                clip.texture.minFilter = THREE.LinearFilter;
                clip.texture.magFilter = THREE.LinearFilter;
                clip.texture.generateMipmaps = false;
                clip.ready = true;
                for (const apply of clip.waiters) {
                    apply(clip.texture);
                }
                clip.waiters = [];
            });
            img.src = url;
            return clip;
        }

        function bindArtwork(planeMat, url) {
            const clip = artworkClip(url);
            const apply = (tex) => {
                if (!tex) {
                    planeMat.map = null;
                    planeMat.color.set(0xc41818);
                } else {
                    planeMat.map = tex;
                    planeMat.color.set(0xffffff);
                }
                planeMat.needsUpdate = true;
            };
            if (clip.failed) {
                apply(null);
                return;
            }
            if (clip.ready) {
                apply(clip.texture);
                return;
            }
            clip.waiters.push(apply);
        }

        function updateArtworkClips() {
            for (const clip of artworkClips.values()) {
                if (!clip.animated || !clip.ready || !clip.ctx) {
                    continue;
                }
                clip.ctx.clearRect(0, 0, clip.canvas.width, clip.canvas.height);
                clip.ctx.drawImage(clip.img, 0, 0, clip.canvas.width, clip.canvas.height);
                clip.texture.needsUpdate = true;
            }
        }

        function isWalkable(cell) {
            return cell === 0 || cell === 2;
        }

        function isFloorTile(cell) {
            return cell === 0 || cell === 2 || cell === FURNITURE;

        function isFullWall(cell) {
            return cell === FULL_WALL;

        function isWallLike(cell) {
            return cell === FULL_WALL || cell === HALF_WALL || cell === BROKEN_WALL

        function collectFaces(grid, width, height) {
            const faces = [];
            for (let z = 0; z < height; z++) {
                for (let x = 0; x < width; x++) {
                    const cell = grid[z][x];
                    if (!isWalkable(cell)) {
                        continue;
                    }
                    for (let d = 0; d < 4; d++) {
                        const { dx, dz } = WALL_DIRS[d];
                        const wx = x + dx;
                        const wz = z + dz;
                        if (!isFullWall(grid[wz]?.[wx])) {
                            continue;
                        }
                        faces.push({
                            x,
                            z,
                            wx,
                            wz,
                            dx,
                            dz,
                            hash: Math.abs(x * 17 + z * 23 + d * 41),
                            propHash: Math.abs(x * 19 + z * 31 + d * 43),
                        });
                    }
                }
            }
            return faces;
        }

        function isReservedCell(x, z, player, exit) {
            if (player && player.x === x && player.y === z) {
                return true;
            }
            if (exit && exit.x === x && exit.y === z) {
                return true;
            }
            return false;
        }

        function furnitureGroups(grid, width, height) {
            const seen = new Set();
            const groups = [];
            for (let z = 0; z < height; z++) {
                for (let x = 0; x < width; x++) {
                    if (grid[z][x] !== FURNITURE || seen.has(`${x},${z}`)) {
                        continue;
                    }
                    const cells = [];
                    const queue = [[x, z]];
                    seen.add(`${x},${z}`);
                    for (let i = 0; i < queue.length; i++) {
                        const [cx, cz] = queue[i];
                        cells.push({ x: cx, z: cz });
                        for (const dir of WALL_DIRS) {
                            const nx = cx + dir.dx;
                            const nz = cz + dir.dz;
                            const key = `${nx},${nz}`;
                            if (grid[nz]?.[nx] !== FURNITURE || seen.has(key)) {
                                continue;
                            }
                            seen.add(key);
                            queue.push([nx, nz]);
                        }
                    }
                    let minx = cells[0].x;
                    let maxx = cells[0].x;
                    let minz = cells[0].z;
                    let maxz = cells[0].z;
                    for (const cell of cells) {
                        minx = Math.min(minx, cell.x);
                        maxx = Math.max(maxx, cell.x);
                        minz = Math.min(minz, cell.z);
                        maxz = Math.max(maxz, cell.z);
                    }
                    groups.push({
                        cells,
                        minx,
                        maxx,
                        minz,
                        maxz,
                        hash: Math.abs(minx * 31 + minz * 47 + cells.length * 13),
                    });
                }
            }
            return groups;
        }

        function facingFromWalls(grid, cells) {
            for (const cell of cells) {
                for (const dir of WALL_DIRS) {
                    if (isWallLike(grid[cell.z + dir.dz]?.[cell.x + dir.dx])) {
                        return Math.atan2(-dir.dx, -dir.dz);
                    }
                }
            }
            return 0;
        }

        function placeLargeFurniture(grid, width, height) {
            for (const group of furnitureGroups(grid, width, height)) {
                const n = group.cells.length;
                const cx = (group.minx + group.maxx) / 2;
                const cz = (group.minz + group.maxz) / 2;
                const alongX = group.maxx - group.minx >= group.maxz - group.minz;
                let prop;
                if (n >= 4) {
                    prop = group.hash % 3 === 0 ? makeBed() : makeDiningTable();
                } else if (n >= 2) {
                    if (group.hash % 2 === 0) {
                        prop = makeTable(1.55, 0.7);
                        const c1 = makeChair();
                        c1.position.set(0, 0, -0.48);
                        const c2 = makeChair();
                        c2.position.set(0, 0, 0.48);
                        c2.rotation.y = Math.PI;
                        prop.add(c1, c2);
                    } else {
                        prop = makeBookshelf();
                    }
                } else if (group.hash % 3 === 0) {
                    prop = makeCabinet();
                } else if (group.hash % 3 === 1) {
                    prop = makeTable();
                } else {
                    prop = makeCrate();
                    prop.scale.set(1.7, 1.7, 1.7);
                }
                prop.position.set(cx, 0, cz);
                if (n === 1 || (n === 2 && group.hash % 2 !== 0)) {
                    prop.rotation.y = facingFromWalls(grid, group.cells);
                } else {
                    prop.rotation.y = alongX ? 0 : Math.PI / 2;
                }
                propRoot.add(prop);
            }
        }

        const WALL_PROP_MAKERS = [makeHole, makeWeapons, makeBanner];
        const FLOOR_PROP_MAKERS = [makePlant, makeBarrel, makeCrate, makeChair];
        const DETAIL_PROP_MAKERS = [makePit, makeRug];

        function placeTorches(grid, width, height) {
            clearTorches();
            const faces = collectFaces(grid, width, height);
            const spots = faces.filter((face) => face.hash % 5 === 0).sort((a, b) => a.hash - b.hash).slice(0, 12);
            const used = new Set();
            torchRoot = new THREE.Group();
            for (const spot of spots) {
                used.add(faceKey(spot.wx, spot.wz, spot.dx, spot.dz));
                const px = spot.wx - spot.dx * 0.54;
                const pz = spot.wz - spot.dz * 0.54;
                const py = 0.5;
                const torch = makeTorch();
                torch.position.set(px, py, pz);
                torch.rotation.y = Math.atan2(-spot.dx, -spot.dz);
                torchRoot.add(torch);

                const light = new THREE.RectAreaLight(0xff8a3a, 9, 0.16, 0.28);
                light.position.set(px - spot.dx * 0.06, py + 0.18, pz - spot.dz * 0.06);
                light.rotation.y = Math.atan2(spot.dx, spot.dz);
                light.userData.base = 8 + (spot.hash % 5) * 0.4;
                scene.add(light);
                torchLights.push(light);
            }
            scene.add(torchRoot);
            return used;
        }

        function placeProps(grid, width, height, player, exit, torchFaces) {
            clearProps();
            propRoot = new THREE.Group();
            const faces = collectFaces(grid, width, height);
            const openFaces = faces
                .filter((face) => !torchFaces.has(faceKey(face.wx, face.wz, face.dx, face.dz)))
                .filter((face) => !isReservedCell(face.x, face.z, player, exit));

            const paintingSpots = openFaces
                .filter((face) => face.propHash % 2 === 0)
                .sort((a, b) => a.propHash - b.propHash)
                .slice(0, 28);
            const paintingFaces = new Set(paintingSpots.map((face) => faceKey(face.wx, face.wz, face.dx, face.dz)));

            const usedCells = new Set();
            for (const spot of paintingSpots) {
                const prop = makePainting(spot.propHash);
                const px = spot.wx - spot.dx * 0.54;
                const pz = spot.wz - spot.dz * 0.54;
                prop.position.set(px, EYE, pz);
                prop.rotation.y = Math.atan2(-spot.dx, -spot.dz);
                propRoot.add(prop);
                usedCells.add(`${spot.x},${spot.z}`);
            }

            const wallSpots = openFaces
                .filter((face) => !paintingFaces.has(faceKey(face.wx, face.wz, face.dx, face.dz)))
                .filter((face) => face.propHash % 5 === 0)
                .sort((a, b) => a.propHash - b.propHash)
                .slice(0, 10);
            for (const spot of wallSpots) {
                const maker = WALL_PROP_MAKERS[spot.propHash % WALL_PROP_MAKERS.length];
                const prop = maker(spot.propHash);
                const px = spot.wx - spot.dx * 0.54;
                const pz = spot.wz - spot.dz * 0.54;
                const heights = [0.72, 0.92, 0.78, 0.95];
                prop.position.set(px, heights[spot.propHash % heights.length], pz);
                prop.rotation.y = Math.atan2(-spot.dx, -spot.dz);
                propRoot.add(prop);
                usedCells.add(`${spot.x},${spot.z}`);
            }

            const floorCells = [];
            for (let z = 0; z < height; z++) {
                for (let x = 0; x < width; x++) {
                    const cell = grid[z][x];
                    if (cell !== 0 && cell !== 2) {
                        continue;
                    }
                    if (isReservedCell(x, z, player, exit) || usedCells.has(`${x},${z}`)) {
                        continue;
                    }
                    const hash = Math.abs(x * 37 + z * 53);
                    floorCells.push({ x, z, hash });
                }
            }
            floorCells.sort((a, b) => a.hash - b.hash);

            const furniture = floorCells.filter((cell) => cell.hash % 7 === 0).slice(0, 12);
            const furnitureCells = new Set(furniture.map((cell) => `${cell.x},${cell.z}`));
            for (const cell of furniture) {
                const walls = WALL_DIRS.filter((dir) => isWallLike(grid[cell.z + dir.dz]?.[cell.x + dir.dx]));
                const dir = walls[cell.hash % Math.max(1, walls.length)] || { dx: 0, dz: 1 };
                const maker = FLOOR_PROP_MAKERS[cell.hash % FLOOR_PROP_MAKERS.length];
                const prop = maker(cell.hash);
                prop.position.set(cell.x + dir.dx * 0.32, 0, cell.z + dir.dz * 0.32);
                prop.rotation.y = Math.atan2(-dir.dx, -dir.dz);
                propRoot.add(prop);
            }

            const details = floorCells
                .filter((cell) => !furnitureCells.has(`${cell.x},${cell.z}`) && cell.hash % 11 === 0)
                .slice(0, 8);
            for (const cell of details) {
                const maker = DETAIL_PROP_MAKERS[cell.hash % DETAIL_PROP_MAKERS.length];
                const prop = maker(cell.hash);
                const ox = ((cell.hash % 5) - 2) * 0.06;
                const oz = ((cell.hash % 3) - 1) * 0.06;
                prop.position.set(cell.x + ox, 0, cell.z + oz);
                prop.rotation.y = (cell.hash % 4) * (Math.PI / 2);
                propRoot.add(prop);
            }

            placeLargeFurniture(grid, width, height);
            scene.add(propRoot);
        }

        function rebuildMaze(state) {
            disposeMesh(floorBase);
            for (const mesh of floorMeshes) {
                disposeMesh(mesh);
            }
            floorMeshes = [];
            disposeMesh(ceilMesh);
            disposeMesh(wallMesh);
            disposeMesh(vineWallMesh);
            disposeMesh(crackedWallMesh);
            disposeMesh(halfWallMesh);
            disposeMesh(brokenWallMesh);
            clearExtraWalls();
            clearTorches();
            clearProps();

            const w = state.width;
            const h = state.height;
            const floorGeo = new THREE.PlaneGeometry(w * CELL, h * CELL);
            floorGeo.rotateX(-Math.PI / 2);
            floorBase = new THREE.Mesh(floorGeo, floorBaseMat);
            floorBase.position.set((w - 1) / 2, -0.02, (h - 1) / 2);
            floorBase.receiveShadow = true;
            scene.add(floorBase);

            const ceilGeo = new THREE.PlaneGeometry(w * CELL, h * CELL);
            ceilGeo.rotateX(Math.PI / 2);
            ceilMesh = new THREE.Mesh(ceilGeo, ceilMat);
            ceilMesh.position.set((w - 1) / 2, WALL_H, (h - 1) / 2);
            scene.add(ceilMesh);

            const stoneWalls = [];
            const vineWalls = [];
            const crackedWalls = [];
            const halfWalls = [];
            const brokenWalls = [];
            const holeWalls = [];
            const fenceWalls = [];
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const cell = state.grid[y][x];
                    if (cell === FULL_WALL) {
                        const kind = (x * 7 + y * 13) % 5;
                        if (kind === 0) {
                            vineWalls.push(x, y);
                        } else if (kind === 1) {
                            crackedWalls.push(x, y);
                        } else {
                            stoneWalls.push(x, y);
                        }
                    } else if (cell === HALF_WALL) {
                        halfWalls.push(x, y);
                    } else if (cell === BROKEN_WALL) {
                        brokenWalls.push(x, y);
                    } else if (cell === HOLE_WALL) {
                        holeWalls.push(x, y);
                    } else if (cell === FENCE_WALL) {
                        fenceWalls.push(x, y);
                    }
                }
            }

            function buildWalls(positions, material, height, widthX = 1.02, widthZ = 1.02) {
                const count = positions.length / 2 || 1;
                const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(widthX, height, widthZ), material, count);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                const dummy = new THREE.Object3D();
                const color = new THREE.Color();
                for (let i = 0; i < positions.length; i += 2) {
                    const index = i / 2;
                    dummy.position.set(positions[i], height / 2, positions[i + 1]);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(index, dummy.matrix);
                    const shade = 0.88 + ((positions[i] * 13 + positions[i + 1] * 7) % 9) * 0.015;
                    color.setRGB(shade, shade, shade);
                    mesh.setColorAt(index, color);
                }
                mesh.instanceMatrix.needsUpdate = true;
                if (mesh.instanceColor) {
                    mesh.instanceColor.needsUpdate = true;
                }
                scene.add(mesh);
                return mesh;
            }

            wallMesh = stoneWalls.length ? buildWalls(stoneWalls, wallMat, WALL_H) : null;
            vineWallMesh = vineWalls.length ? buildWalls(vineWalls, vineWallMat, WALL_H) : null;
            crackedWallMesh = crackedWalls.length ? buildWalls(crackedWalls, crackedWallMat, WALL_H) : null;
            halfWallMesh = halfWalls.length ? buildWalls(halfWalls, wallMat, HALF_H) : null;
            brokenWallMesh = brokenWalls.length ? buildWalls(brokenWalls, crackedWallMat, BROKEN_H, 0.94, 0.88) : null;

            extraWallRoot = new THREE.Group();
            for (let i = 0; i < holeWalls.length; i += 2) {
                const hole = makeHoleWall();
                hole.position.set(holeWalls[i], 0, holeWalls[i + 1]);
                extraWallRoot.add(hole);
            }
            for (let i = 0; i < fenceWalls.length; i += 2) {
                const fence = makeFenceWall();
                fence.position.set(fenceWalls[i], 0, fenceWalls[i + 1]);
                extraWallRoot.add(fence);
            }
            scene.add(extraWallRoot);

            const floorBuckets = FLOOR_KINDS.map(() => []);
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (!isFloorTile(state.grid[y][x])) {
                        continue;
                    }
                    const kind = Math.abs(x * 11 + y * 29) % FLOOR_KINDS.length;
                    floorBuckets[kind].push(x, y);
                }
            }

            const tileGeo = new THREE.PlaneGeometry(1, 1);
            tileGeo.rotateX(-Math.PI / 2);
            const dummy = new THREE.Object3D();
            const color = new THREE.Color();
            for (let k = 0; k < floorBuckets.length; k++) {
                const positions = floorBuckets[k];
                if (!positions.length) {
                    continue;
                }
                const mesh = new THREE.InstancedMesh(tileGeo.clone(), floorMats[k], positions.length / 2);
                mesh.receiveShadow = true;
                for (let i = 0; i < positions.length; i += 2) {
                    const index = i / 2;
                    dummy.position.set(positions[i], 0.002, positions[i + 1]);
                    dummy.rotation.y = ((positions[i] + positions[i + 1]) % 4) * (Math.PI / 2);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(index, dummy.matrix);
                    const shade = 0.9 + ((positions[i] * 5 + positions[i + 1] * 11) % 6) * 0.02;
                    color.setRGB(shade, shade, shade);
                    mesh.setColorAt(index, color);
                }
                mesh.instanceMatrix.needsUpdate = true;
                if (mesh.instanceColor) {
                    mesh.instanceColor.needsUpdate = true;
                }
                scene.add(mesh);
                floorMeshes.push(mesh);
            }
            tileGeo.dispose();

            const torchFaces = placeTorches(state.grid, w, h);
            placeProps(state.grid, w, h, state.player, state.exit, torchFaces);
        }

        function applyState(state, snap) {
            if (!state) {
                return;
            }
            if (Array.isArray(state.artwork)) {
                artworkUrls = state.artwork.map((url) => String(url || '').trim()).filter(Boolean);
            }
            applyCanvasSize(state.canvasWidth, state.canvasHeight, state.anchor);
            const showing = state.visible !== false;
            const resume = showing && document.documentElement.classList.contains('paused');
            setOverlayVisible(showing);
            if (!showing) {
                return;
            }
            if (!state.grid?.length) {
                return;
            }
            if (transitioning) {
                pendingState = state;
                return;
            }
            const nextFloor = Number(state.floor);
            const isNewFloor = shownFloor !== null && nextFloor !== shownFloor;
            if (isNewFloor && !snap && !resume) {
                startLevelTransition(state);
                return;
            }
            commitWorld(state, snap || resume || shownFloor === null);
            shownFloor = nextFloor;
        }

        function applyCanvasSize(width, height, corner) {
            const w = Number(width) > 0 ? Math.round(Number(width)) : 640;
            const h = Number(height) > 0 ? Math.round(Number(height)) : 480;
            canvasW = w;
            canvasH = h;
            stageEl.style.width = `${w}px`;
            stageEl.style.height = `${h}px`;
            stageEl.style.setProperty('--ui-scale', String(w / 640));
            const anchor = corner === 'top-right' || corner === 'bottom-left' || corner === 'bottom-right'
                ? corner
                : 'top-left';
            stageEl.classList.toggle('anchor-top-left', anchor === 'top-left');
            stageEl.classList.toggle('anchor-top-right', anchor === 'top-right');
            stageEl.classList.toggle('anchor-bottom-left', anchor === 'bottom-left');
            stageEl.classList.toggle('anchor-bottom-right', anchor === 'bottom-right');
            syncRendererSize();
        }

        function syncRendererSize() {
            const w = canvasW || 640;
            const h = canvasH || 480;
            camera.aspect = w / Math.max(1, h);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        function setOverlayVisible(on) {
            overlayOn = on;
            document.documentElement.classList.toggle('paused', !on);
            renderer.domElement.style.opacity = on ? '1' : '0';
            if (on) {
                startLoop();
            } else {
                stopLoop();
            }
        }

        function startLoop() {
            if (rafId) {
                return;
            }
            clock.getDelta();
            rafId = requestAnimationFrame(tick);
        }

        function stopLoop() {
            if (!rafId) {
                return;
            }
            cancelAnimationFrame(rafId);
            rafId = 0;
        }

        function startLevelTransition(state) {
            transitioning = true;
            pendingState = state;
            transitionMsgEl.textContent = `Entering Level ${state.floor}`;
            transitionEl.classList.remove('title');
            transitionEl.classList.add('out');

            window.setTimeout(() => {
                const next = pendingState || state;
                commitWorld(next, true);
                shownFloor = Number(next.floor);
                transitionEl.classList.add('title');
            }, 500);

            window.setTimeout(() => {
                transitionEl.classList.remove('out', 'title');
            }, 2000);

            window.setTimeout(() => {
                transitioning = false;
                const next = pendingState;
                pendingState = null;
                if (next) {
                    applyState(next, false);
                }
            }, 2550);
        }

        function commitWorld(state, snap) {
            const key = `${state.floor}:${state.width}:${state.height}`;
            if (key !== mazeKey) {
                mazeKey = key;
                rebuildMaze(state);
                snap = true;
            }

            const player = state.player;
            targetPos.set(player.x * CELL, EYE, player.y * CELL);
            targetYaw = YAWS[player.dir] ?? 0;
            if (snap) {
                camPos.copy(targetPos);
                camYaw = targetYaw;
                bump = 0;
            }

            if (state.exit) {
                exitMesh.position.set(state.exit.x, 0, state.exit.y);
                exitTarget.position.set(state.exit.x, 0, state.exit.y);
                exitSpot.position.set(state.exit.x, WALL_H - 0.04, state.exit.y);
            }

            if (state.at && state.at !== lastAt && state.lastAction?.bumped) {
                bump = state.lastAction.command === 'down' ? -0.14 : 0.14;
            }
            lastAt = state.at || lastAt;

            floorEl.textContent = String(state.floor ?? 0);
            const autoplaying = state.mode === 'autoplay';
            modeNameEl.textContent = state.mode === 'democracy' ? 'Democracy' : autoplaying ? 'Autoplay' : 'Anarchy';
            modeHintEl.textContent = autoplaying ? 'Chat !up to take over' : '';
            modeEl.classList.toggle('democracy', state.mode === 'democracy');
            modeEl.classList.toggle('autoplay', autoplaying);
            hudEl.classList.toggle('autoplay', autoplaying);
            helpEl.textContent = autoplaying ? 'Autoplay · !up to take over' : '!up !down !left !right';

            const action = state.lastAction;
            if (autoplaying && action?.user === 'autoplay') {
                lastEl.innerHTML = `Autoplay <span>walking</span>`;
            } else if (action?.displayName) {
                const extra = action.vote ? ' · voting' : action.bumped ? ' · wall' : '';
                lastEl.innerHTML = `${escapeHtml(action.displayName)} <span>!${escapeHtml(action.command)}${extra}</span>`;
            } else {
                lastEl.innerHTML = '<span>Waiting for chat</span>';
            }

            const voting = state.mode === 'democracy' && state.votes;
            votesEl.classList.toggle('open', Boolean(voting));
            voteEndsAt = voting && state.voteEndsAt ? Date.parse(state.voteEndsAt) : 0;
            if (voting) {
                const total = Math.max(1, Object.values(state.votes).reduce((sum, n) => sum + n, 0));
                for (const command of ['up', 'down', 'left', 'right']) {
                    const n = state.votes[command] || 0;
                    document.getElementById(`n-${command}`).textContent = String(n);
                    document.getElementById(`bar-${command}`).style.width = `${(n / total) * 100}%`;
                }
            }
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function tick() {
            if (!overlayOn) {
                rafId = 0;
                return;
            }
            rafId = requestAnimationFrame(tick);
            const dt = clock.getDelta();
            const t = 1 - Math.exp(-dt * 9);
            camPos.lerp(targetPos, t);
            camYaw = lerpAngle(camYaw, targetYaw, t);
            bump *= Math.exp(-dt * 9);

            const bob = Math.sin(clock.elapsedTime * 2.1) * 0.018;
            const lookX = -Math.sin(camYaw);
            const lookZ = -Math.cos(camYaw);
            camera.position.set(
                camPos.x + lookX * bump,
                camPos.y + bob,
                camPos.z + lookZ * bump,
            );
            camera.rotation.y = camYaw;
            torch.intensity = 1.6 + Math.sin(clock.elapsedTime * 11) * 0.12;
            torchFlameMat.emissiveIntensity = 2.1 + Math.sin(clock.elapsedTime * 17) * 0.45 + Math.sin(clock.elapsedTime * 29) * 0.2;
            for (let i = 0; i < torchLights.length; i++) {
                const light = torchLights[i];
                const flicker = Math.sin(clock.elapsedTime * 14 + i * 1.7) * 1.1 + Math.sin(clock.elapsedTime * 23 + i) * 0.6;
                light.intensity = light.userData.base + flicker;
            }
            goldMat.emissiveIntensity = 0.45 + Math.sin(clock.elapsedTime * 3) * 0.18;
            exitCrown.rotation.y = clock.elapsedTime * 0.7;
            const beamPulse = 0.5 + 0.5 * Math.sin(clock.elapsedTime * 2.4);
            exitSpot.intensity = 24 + beamPulse * 8;
            exitBeam.material.opacity = 0.14 + beamPulse * 0.08;
            exitBeamCore.material.opacity = 0.22 + beamPulse * 0.12;
            updateArtworkClips();

            if (voteEndsAt) {
                const left = Math.max(0, (voteEndsAt - Date.now()) / 1000);
                voteTitleEl.textContent = `Democracy · ${left.toFixed(1)}s`;
            }

            renderer.render(scene, camera);
        }

        addEventListener('resize', () => {
            syncRendererSize();
        });

        fetch('/api/dungeon')
            .then((res) => res.json())
            .then((state) => applyState(state, true))
            .catch(() => {
                lastEl.innerHTML = '<span>Could not load dungeon</span>';
            });

        const source = new EventSource('/api/dungeon/events');
        source.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'state' || data.grid) {
                applyState(data, false);
            }
        };

        if (preview) {
            let next = 'up';
            const send = async () => {
                if (!overlayOn) {
                    return;
                }
                try {
                    const res = await fetch('/api/dungeon/input', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ command: next, user: 'preview', displayName: 'preview' }),
                    });
                    const state = await res.json();
                    if (state.bumped || state.lastAction?.bumped) {
                        next = Math.random() < 0.5 ? 'left' : 'right';
                    } else if (state.lastAction?.command === 'left' || state.lastAction?.command === 'right') {
                        next = 'up';
                    } else if (Math.random() < 0.12) {
                        next = Math.random() < 0.5 ? 'left' : 'right';
                    } else {
                        next = 'up';
                    }
                } catch {
                    next = 'up';
                }
            };
            send();
            setInterval(send, 800);
        }

        startLoop();
    </script>
</body>
</html>
