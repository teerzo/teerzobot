<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>teerzobot OBS</title>
    <style>
        html, body {
            margin: 0;
            background: transparent;
            overflow: hidden;
        }
        #panel {
            display: inline-block;
            margin: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            font: 16px/1.3 sans-serif;
            text-shadow: 0 1px 2px #000;
        }
        #status {
            opacity: 0.85;
        }
        #log {
            margin-top: 4px;
            min-height: 1.3em;
        }
    </style>
</head>
<body>
    <div id="panel">
        <div id="status">teerzobot OBS — connecting…</div>
        <div id="log"></div>
    </div>
    <script>
        const statusEl = document.getElementById('status');
        const logEl = document.getElementById('log');
        let hideTimer;

        function setStatus(text) {
            statusEl.textContent = text;
        }

        function show(text) {
            logEl.textContent = text;
            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
                logEl.textContent = '';
            }, 4000);
        }

        async function main() {
            const config = await fetch('/api/obs/config').then((res) => res.json());
            const scenes = config.scenes || {};
            const sceneNames = Object.keys(scenes);
            const source = new EventSource('/api/obs/events');

            source.onopen = () => {
                const extra = sceneNames.length
                    ? `scenes: ${sceneNames.map((name) => `!obs ${name}`).join(', ')}`
                    : 'no OBS_SCENE_* mapped';
                setStatus(`teerzobot OBS — connected · ${extra}`);
            };

            source.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const sceneKey =
                    data.command === 'obs'
                        ? String(data.args?.[0] ?? '')
                              .trim()
                              .toLowerCase()
                              .replace(/^!/, '')
                        : data.command;
                const scene = sceneKey ? scenes[sceneKey] : null;
                if (scene && window.obsstudio && typeof window.obsstudio.setCurrentScene === 'function') {
                    window.obsstudio.setCurrentScene(scene);
                }
                if (data.command === 'obs' && sceneKey) {
                    show(`obs ${sceneKey} (${data.displayName || data.user || 'chat'})`);
                } else if (data.command) {
                    show(`${data.command} (${data.displayName || data.user || 'chat'})`);
                }
            };

            source.onerror = () => {
                setStatus('teerzobot OBS — reconnecting…');
            };
        }

        main().catch((err) => {
            setStatus(`teerzobot OBS — ${err.message || 'failed to load'}`);
        });
    </script>
</body>
</html>
