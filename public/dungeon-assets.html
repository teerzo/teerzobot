<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>teerzobot dungeon assets</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #0b0d12;
            color: #e8e4dc;
            font: 14px/1.4 "Trebuchet MS", "Segoe UI", sans-serif;
        }
        #app {
            position: fixed;
            inset: 0;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #hud {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            pointer-events: none;
            user-select: none;
        }
        #label, #count, #hint {
            padding: 6px 10px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.45);
        }
        #label {
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-size: 13px;
        }
        #count {
            font-size: 11px;
            opacity: 0.8;
            font-variant-numeric: tabular-nums;
        }
        #hint {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            opacity: 0.75;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
        }
        .nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 56px;
            height: 72px;
            border: 0;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: #e8e4dc;
            font-size: 36px;
            line-height: 1;
            cursor: pointer;
            z-index: 2;
        }
        .nav:hover,
        .nav:focus-visible {
            background: rgba(0, 0, 0, 0.72);
            outline: 1px solid rgba(232, 228, 220, 0.35);
        }
        .nav:active {
            transform: translateY(-50%) scale(0.96);
        }
        #prev { left: 14px; }
        #next { right: 14px; }
        @media (max-width: 640px) {
            .nav {
                width: 44px;
                height: 56px;
                font-size: 28px;
            }
            #prev { left: 8px; }
            #next { right: 8px; }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <button type="button" id="prev" class="nav" aria-label="Previous model">‹</button>
    <button type="button" id="next" class="nav" aria-label="Next model">›</button>
    <div id="hud">
        <div id="label">goblin</div>
        <div id="count">1 / 1</div>
    </div>
    <div id="hint">← → to switch &middot; drag to orbit &middot; scroll to zoom</div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { createDungeonModels } from '/dungeon-models.js';

        const container = document.getElementById('app');
        const labelEl = document.getElementById('label');
        const countEl = document.getElementById('count');

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0d12);

        const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
        camera.position.set(0.9, 0.8, 1.4);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 0.28, 0);
        controls.minDistance = 0.2;
        controls.maxDistance = 16;

        scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a1712, 0.85));
        const keyLight = new THREE.DirectionalLight(0xfff2d8, 1.6);
        keyLight.position.set(2, 3, 2);
        scene.add(keyLight);
        const fillLight = new THREE.DirectionalLight(0x88aaff, 0.5);
        fillLight.position.set(-2, 1, -1.5);
        scene.add(fillLight);

        const grid = new THREE.GridHelper(4, 16, 0x3a4356, 0x21262f);
        scene.add(grid);

        const { assets } = createDungeonModels(THREE);
        let index = 0;
        let current = null;

        function frameObject(object) {
            const bounds = new THREE.Box3().setFromObject(object);
            if (bounds.isEmpty()) {
                controls.target.set(0, 0.28, 0);
                camera.position.set(0.9, 0.8, 1.4);
                controls.update();
                return;
            }
            const center = bounds.getCenter(new THREE.Vector3());
            const size = bounds.getSize(new THREE.Vector3());
            const radius = Math.max(size.x, size.y, size.z) * 0.5 || 0.4;
            controls.target.copy(center);
            camera.position.set(
                center.x + radius * 2.2,
                center.y + radius * 1.4,
                center.z + radius * 2.8,
            );
            controls.minDistance = Math.max(0.15, radius * 0.35);
            controls.maxDistance = Math.max(8, radius * 12);
            controls.update();
        }

        function show(nextIndex) {
            const total = assets.length;
            index = ((nextIndex % total) + total) % total;
            const asset = assets[index];
            if (current) {
                scene.remove(current);
            }
            current = asset.create();
            scene.add(current);
            frameObject(current);
            labelEl.textContent = asset.name;
            countEl.textContent = `${index + 1} / ${total}`;
            const hash = `#${asset.id}`;
            if (location.hash !== hash) {
                history.replaceState(null, '', hash);
            }
        }

        function indexFromHash() {
            const id = decodeURIComponent(location.hash.replace(/^#/, '')).trim();
            if (!id) {
                return 0;
            }
            const found = assets.findIndex((asset) => asset.id === id);
            return found >= 0 ? found : 0;
        }

        document.getElementById('prev').addEventListener('click', () => show(index - 1));
        document.getElementById('next').addEventListener('click', () => show(index + 1));
        window.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowLeft' || event.key === 'a' || event.key === 'A') {
                event.preventDefault();
                show(index - 1);
            } else if (event.key === 'ArrowRight' || event.key === 'd' || event.key === 'D') {
                event.preventDefault();
                show(index + 1);
            }
        });
        window.addEventListener('hashchange', () => {
            const next = indexFromHash();
            if (next !== index) {
                show(next);
            }
        });

        function resize() {
            const width = container.clientWidth || window.innerWidth;
            const height = container.clientHeight || window.innerHeight;
            if (width < 1 || height < 1) return;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height, false);
        }
        resize();
        window.addEventListener('resize', resize);
        if (typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(resize).observe(container);
        }

        show(indexFromHash());

        renderer.setAnimationLoop(() => {
            controls.update();
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
