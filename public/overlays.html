<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>teerzobot overlays</title>
    <link rel="stylesheet" href="/manage.css">
</head>
<body>
    <div id="chrome"></div>
    <div class="page">
        <h1>Overlays</h1>
        <p class="muted">Copy a URL into an OBS Browser Source. Previews are live.</p>
        <p><button type="button" class="danger" id="clear-all">Clear dance, DVD, chat, tic-tac-toe &amp; dungeon</button></p>
        <div class="grid" id="grid"></div>
    </div>
    <script src="/manage.js"></script>
    <script>
        bootManageChrome();

        const overlays = [
            {
                name: 'Chat',
                path: '/chat',
                commands: ['!chat', '!clear'],
                note: 'Mods: !clear empties and hides it; !chat toggles visibility.',
                clearPath: '/api/chat/clear',
            },
            {
                name: 'Follow alerts',
                path: '/alerts',
                note: 'Keep on every scene that should show alerts. Preview: /alerts?preview=1',
            },
            {
                name: 'Now playing',
                path: '/now-playing',
                commands: ['!song'],
            },
            {
                name: 'DVD logo',
                path: '/dvd',
                commands: ['!dvd', '!dvd add', '!dvd remove', '!dvd fast', '!dvd slow'],
                clearPath: '/api/dvd/clear',
            },
            {
                name: 'Dance GIFs',
                path: '/dance',
                commands: ['!dance <url>', '!dance remove', '!dance clear'],
                note: 'Queued GIFs are approved at /manage/dance.',
                clearPath: '/api/dance/clear',
            },
            {
                name: 'Tic-tac-toe',
                path: '/ttt',
                commands: ['!ttt', '!ttt 1-9'],
                note: 'First chatter is X, second is O. !clear (mods) hides it; !ttt shows it again.',
                clearPath: '/api/ttt/clear',
            },
            {
                name: 'Dungeon',
                path: '/dungeon',
                commands: ['!up', '!down', '!left', '!right', '!fire', '!dungeon', '!dc bigger', '!dc smaller', '!phone', '!phone bigger', '!dc landscape', '!dc topleft', '!dc shh', '!dc anarchy', '!dc democracy', '!dc autoplay'],
                note: 'OBS Browser Source 1920×1080. Canvas starts 640×480 top-left. Mods: !dc bigger / !dc smaller / !dc topleft. For phones, !dc phone (or !phone) switches to a portrait 9:16 canvas (540×960) with a scaled HUD; !phone bigger / smaller step 360×640 → 405×720 → 540×960 → 608×1080, and !dc landscape returns to wide. !fire shoots a firebolt that explodes on walls. !dc shh mutes floor/autoplay chat. !clear (mods) hides it; !dungeon shows it again. Preview: /dungeon?preview=1',
                clearPath: '/api/dungeon/clear',
                previewClass: 'ratio-16x9',
                sizes: [
                    { label: '1920×1080', width: 1920, height: 1080 },
                    { label: 'Phone 540×960', width: 540, height: 960 },
                ],
            },
            {
                name: 'Scene control',
                path: '/obs',
                commands: ['!obs', '!obs <name>'],
                note: 'Set Control Level to Advanced. Scenes come from OBS_SCENE_* env vars.',
            },
        ];

        const grid = document.getElementById('grid');

        function overlayUrl(path) {
            return `${location.origin}${path}`;
        }

        async function copyUrl(url, button) {
            try {
                await navigator.clipboard.writeText(url);
            } catch {
                const input = button.previousElementSibling;
                input.select();
                document.execCommand('copy');
            }
            const label = button.textContent;
            button.textContent = 'Copied';
            setTimeout(() => {
                button.textContent = label;
            }, 1200);
        }

        function renderCard(overlay) {
            const url = overlayUrl(overlay.path);
            const card = document.createElement('article');
            card.className = 'card';
            const commands = overlay.commands?.length
                ? `<p class="cmds">${overlay.commands.map((name) => `<code>${name}</code>`).join(' · ')}</p>`
                : '';
            const note = overlay.note ? `<p class="note">${overlay.note}</p>` : '';
            const clear = overlay.clearPath
                ? `<button type="button" class="danger clear">Clear</button>`
                : '';
            const sizes = overlay.sizes?.length
                ? `<div class="sizes"><span class="hint">OBS Browser Source size (16:9)</span>${overlay.sizes.map((size) =>
                    `<button type="button" class="size" data-width="${size.width}" data-height="${size.height}">${size.label}</button>`
                ).join('')}</div>`
                : '';
            const previewClass = overlay.previewClass ? ` ${overlay.previewClass}` : '';
            card.innerHTML =
                `<div class="meta">` +
                    `<h2>${overlay.name}</h2>` +
                    `<div class="path">${overlay.path}</div>` +
                    note +
                    commands +
                    `<div class="url-row">` +
                        `<input readonly value="${url}">` +
                        `<button type="button" class="copy">Copy</button>` +
                        clear +
                    `</div>` +
                    sizes +
                `</div>` +
                `<div class="preview${previewClass}"><iframe title="${overlay.name}" src="${overlay.path}"></iframe></div>`;
            card.querySelector('.copy').addEventListener('click', (event) => {
                copyUrl(url, event.currentTarget);
            });
            for (const sizeBtn of card.querySelectorAll('.size')) {
                sizeBtn.addEventListener('click', async () => {
                    const label = sizeBtn.textContent;
                    try {
                        await navigator.clipboard.writeText(url);
                    } catch {
                        const input = card.querySelector('.url-row input');
                        input.select();
                        document.execCommand('copy');
                    }
                    sizeBtn.textContent = `Copied · OBS ${sizeBtn.dataset.width}×${sizeBtn.dataset.height}`;
                    setTimeout(() => {
                        sizeBtn.textContent = label;
                    }, 1400);
                });
            }
            const clearBtn = card.querySelector('.clear');
            if (clearBtn && overlay.clearPath) {
                clearBtn.addEventListener('click', async () => {
                    clearBtn.disabled = true;
                    try {
                        await fetch(overlay.clearPath, { method: 'POST' });
                    } finally {
                        clearBtn.disabled = false;
                    }
                });
            }
            return card;
        }

        for (const overlay of overlays) {
            grid.appendChild(renderCard(overlay));
        }

        const clearAll = document.getElementById('clear-all');
        clearAll.addEventListener('click', async () => {
            clearAll.disabled = true;
            try {
                await Promise.all([
                    fetch('/api/dance/clear', { method: 'POST' }),
                    fetch('/api/dvd/clear', { method: 'POST' }),
                    fetch('/api/chat/clear', { method: 'POST' }),
                    fetch('/api/ttt/clear', { method: 'POST' }),
                    fetch('/api/dungeon/clear', { method: 'POST' }),
                ]);
            } finally {
                clearAll.disabled = false;
            }
        });
    </script>
</body>
</html>
