<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>teerzobot</title>
    <link rel="stylesheet" href="/manage.css">
</head>
<body>
    <div id="chrome"></div>
    <div class="home">
        <aside class="status-panel">
            <h2>Bot status</h2>
            <dl>
                <dt>Twitch chat</dt>
                <dd id="chat-state">loading…</dd>
                <dt>Channel</dt>
                <dd id="channel-state">—</dd>
                <dt>Discord</dt>
                <dd id="discord-state">—</dd>
                <dt>Discord install</dt>
                <dd id="discord-install">—</dd>
            </dl>
        </aside>
        <div class="chat-frame">
            <iframe id="twitch-chat" title="Twitch chat"></iframe>
        </div>
    </div>
    <script src="/manage.js"></script>
    <script>
        bootManageChrome();

        fetch('/api/status')
            .then((res) => res.json())
            .then((status) => {
                const channel = status.channel || '';
                document.getElementById('chat-state').textContent = status.connected ? 'connected' : 'offline';
                document.getElementById('channel-state').textContent = channel ? `#${channel}` : 'not set';
                document.getElementById('discord-state').textContent = status.discord?.connected ? 'connected' : 'offline';
                const installEl = document.getElementById('discord-install');
                const installUrl = status.discord?.installUrl;
                if (installUrl) {
                    const link = document.createElement('a');
                    link.href = installUrl;
                    link.textContent = 'Add to Discord';
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    installEl.replaceChildren(link);
                } else {
                    installEl.textContent = 'not configured';
                }
                if (channel) {
                    const parent = location.hostname || 'localhost';
                    document.getElementById('twitch-chat').src =
                        `https://www.twitch.tv/embed/${encodeURIComponent(channel)}/chat?parent=${encodeURIComponent(parent)}&darkpopout`;
                }
            })
            .catch(() => {
                document.getElementById('chat-state').textContent = 'unavailable';
            });
    </script>
</body>
</html>
