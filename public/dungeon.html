<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>teerzobot dungeon</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: transparent;
            overflow: hidden;
            color: #fff;
            font: 16px/1.3 "Trebuchet MS", "Segoe UI", sans-serif;
        }
        #stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 640px;
            height: 480px;
            background: #090807;
            overflow: hidden;
            container-type: size;
            container-name: dungeon;
            --ui-scale: 1;
            font-size: calc(16px * var(--ui-scale));
        }
        #stage.anchor-top-left { top: 0; left: 0; right: auto; bottom: auto; }
        #stage.anchor-top-right { top: 0; right: 0; left: auto; bottom: auto; }
        #stage.anchor-bottom-left { bottom: 0; left: 0; top: auto; right: auto; }
        #stage.anchor-bottom-right { bottom: 0; right: 0; top: auto; left: auto; }
        html.paused,
        html.paused body,
        html.paused #stage {
            background: transparent;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            opacity: 1;
        }
        html.paused canvas,
        html.paused #hud {
            opacity: 0;
        }
        #hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
            text-shadow: 0 1px 2px #000, 0 0 8px #000;
        }
        #top {
            position: absolute;
            top: clamp(0.35em, 3.2cqh, 1.1em);
            left: clamp(0.5em, 2.4cqw, 1.25em);
            right: clamp(0.5em, 2.4cqw, 1.25em);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5em;
        }
        #top-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.35em;
        }
        #floor, #mode, #last, #votes, #fps, #hp {
            background: rgba(0, 0, 0, 0.62);
            border-radius: 0.5em;
        }
        #fps {
            padding: 0.25em 0.55em;
            font-size: 0.72em;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-variant-numeric: tabular-nums;
        }
        #hp {
            margin-top: 0.35em;
            padding: 0.3em 0.55em 0.4em;
            display: grid;
            grid-template-columns: 1.8em 1fr;
            gap: 0.4em;
            align-items: center;
            font-size: 0.72em;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            width: 7.4em;
        }
        #hp .bar {
            margin: 0;
        }
        #hp .bar i {
            width: 100%;
            background: #6ee08a;
        }
        #hp.mid .bar i {
            background: #e0d06e;
        }
        #hp.low .bar i {
            background: #e06a5a;
        }
        #vignette.hurt {
            background: radial-gradient(ellipse at center, transparent 28%, rgba(140, 12, 8, 0.62) 100%);
        }
        #floor {
            display: flex;
            align-items: baseline;
            gap: 0.35em;
            white-space: nowrap;
            padding: 0.35em 0.6em;
            font-size: 0.9em;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        #floor strong {
            display: inline;
            font-size: clamp(1.1em, 3.8cqw, 1.5em);
            letter-spacing: 0.02em;
            font-weight: 700;
        }
        #mode {
            padding: 0.35em 0.6em;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.95em;
            font-weight: 700;
            text-align: right;
            background: rgba(180, 40, 28, 0.78);
        }
        #mode strong {
            display: block;
            font-size: 1em;
            letter-spacing: 0.08em;
        }
        #mode-hint {
            display: none;
            margin-top: 0.12em;
            font-size: 0.68em;
            font-weight: 700;
            letter-spacing: 0.04em;
            opacity: 0.92;
            text-transform: uppercase;
        }
        #mode.democracy {
            background: rgba(20, 90, 160, 0.82);
        }
        #mode.autoplay {
            background: rgba(196, 132, 24, 0.92);
            box-shadow: 0 0 0.75em rgba(226, 184, 74, 0.45);
            animation: autoplayPulse 1.6s ease-in-out infinite;
        }
        #mode.autoplay #mode-hint {
            display: block;
        }
        @keyframes autoplayPulse {
            0%, 100% { box-shadow: 0 0 0.5em rgba(226, 184, 74, 0.3); }
            50% { box-shadow: 0 0 1.1em rgba(226, 184, 74, 0.75); }
        }
        #hud.autoplay #vignette {
            background: radial-gradient(ellipse at center, transparent 42%, rgba(48, 24, 0, 0.58) 100%);
        }
        #last {
            position: absolute;
            left: clamp(0.5em, 2.4cqw, 1.25em);
            bottom: clamp(0.5em, 4cqh, 1.4em);
            font-size: clamp(0.95em, 2.8cqw, 1.25em);
            font-weight: 700;
            max-width: 54%;
            padding: 0.35em 0.6em;
        }
        #last span {
            opacity: 0.92;
            font-weight: 700;
            font-size: 0.88em;
        }
        #votes {
            position: absolute;
            right: clamp(0.5em, 2.4cqw, 1.25em);
            bottom: clamp(0.5em, 3.6cqh, 1.25em);
            width: min(15em, 38cqw);
            padding: clamp(0.35em, 1.4cqh, 0.75em) clamp(0.5em, 1.2cqw, 0.9em);
            display: none;
        }
        #votes.open {
            display: block;
        }
        #votes h2 {
            margin: 0 0 0.4em;
            font-size: 0.8em;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .vote {
            display: grid;
            grid-template-columns: 2.8em 1fr 1.5em;
            gap: 0.4em;
            align-items: center;
            margin-top: 0.25em;
            font-size: 0.95em;
            font-weight: 700;
        }
        .bar {
            height: clamp(0.35em, 1.4cqh, 0.5em);
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.18);
            overflow: hidden;
        }
        .bar i {
            display: block;
            height: 100%;
            width: 0;
            background: #7ce0ff;
            transition: width 0.2s ease;
        }
        #vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, 0.55) 100%);
        }
        #help {
            position: absolute;
            top: clamp(0.35em, 3.2cqh, 1.1em);
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.9;
            font-size: 0.85em;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            white-space: nowrap;
            padding: 0.35em 0.6em;
            border-radius: 0.5em;
            background: rgba(0, 0, 0, 0.62);
        }
        @container dungeon (max-width: 680px) {
            #help { display: none; }
        }
        @container dungeon (max-height: 500px) {
            #help { display: none; }
        }
        #transition {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #transition.out {
            opacity: 1;
        }
        #transition-msg {
            opacity: 0;
            color: #f3e6c8;
            font-size: clamp(1.1em, 5cqw, 2.1em);
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 0 1.1em rgba(226, 184, 74, 0.45);
            transition: opacity 0.35s ease;
        }
        #transition.title #transition-msg {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="stage" class="anchor-top-left">
    <div id="hud">
        <div id="vignette"></div>
        <div id="top">
            <div id="top-left">
                <div id="floor">Floor <strong>0</strong></div>
                <div id="fps">-- fps</div>
                <div id="hp"><span>HP</span><div class="bar"><i id="hp-fill"></i></div></div>
            </div>
            <div id="mode"><strong id="mode-name">Anarchy</strong><span id="mode-hint"></span></div>
        </div>
        <div id="help">!up !down !left !right !fire</div>
        <div id="last"><span>Waiting for chat</span></div>
        <div id="votes">
            <h2 id="vote-title">Democracy</h2>
            <div class="vote"><span>!up</span><div class="bar"><i id="bar-up"></i></div><b id="n-up">0</b></div>
            <div class="vote"><span>!down</span><div class="bar"><i id="bar-down"></i></div><b id="n-down">0</b></div>
            <div class="vote"><span>!left</span><div class="bar"><i id="bar-left"></i></div><b id="n-left">0</b></div>
            <div class="vote"><span>!right</span><div class="bar"><i id="bar-right"></i></div><b id="n-right">0</b></div>
        </div>
        <div id="transition"><div id="transition-msg">Entering Level 0</div></div>
    </div>
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
                "gifuct-js": "https://esm.sh/gifuct-js@2.1.2"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { parseGIF, decompressFrames } from 'gifuct-js';

        const params = new URLSearchParams(location.search);
        const preview = params.has('preview');
        const CELL = 1;
        const EYE = 0.52;
        const WALL_H = 1.55;
        const PROP_LIFT = 0.028;
        const WALL_PUSH = 0.62;
        const WALL_DECAL = 0.57;
        const MOVE_LERP = 6.5;
        const SNAP_LERP = 9;
        const YAWS = [0, -Math.PI / 2, Math.PI, Math.PI / 2];

        const floorEl = document.querySelector('#floor strong');
        const fpsEl = document.getElementById('fps');
        const hpEl = document.getElementById('hp');
        const hpFillEl = document.getElementById('hp-fill');
        const vignetteEl = document.getElementById('vignette');
        const hudEl = document.getElementById('hud');
        const stageEl = document.getElementById('stage');
        const modeEl = document.getElementById('mode');
        const modeNameEl = document.getElementById('mode-name');
        const modeHintEl = document.getElementById('mode-hint');
        const helpEl = document.getElementById('help');
        const lastEl = document.getElementById('last');
        const votesEl = document.getElementById('votes');
        const voteTitleEl = document.getElementById('vote-title');
        const transitionEl = document.getElementById('transition');
        const transitionMsgEl = document.getElementById('transition-msg');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x090807);
        scene.fog = new THREE.FogExp2(0x090807, 0.42);

        const camera = new THREE.PerspectiveCamera(110, 640 / 480, 0.05, 18);
        const renderer = new THREE.WebGLRenderer({
            antialias: false,
            powerPreference: 'high-performance',
            stencil: false,
        });
        renderer.setPixelRatio(1);
        renderer.setSize(640, 480);
        renderer.shadowMap.enabled = false;
        document.getElementById('stage').prepend(renderer.domElement);

        const ambient = new THREE.AmbientLight(0x2a241c, 0.4);
        scene.add(ambient);
        const torch = new THREE.PointLight(0xffd6a0, 2.4, 8, 1.6);
        camera.add(torch);
        scene.add(camera);

        const staffWoodMat = new THREE.MeshStandardMaterial({
            color: 0x4a2e18,
            roughness: 0.92,
            metalness: 0.04,
        });
        const staffIronMat = new THREE.MeshStandardMaterial({
            color: 0x8a8174,
            roughness: 0.38,
            metalness: 0.78,
        });
        const staffCrystalMat = new THREE.MeshStandardMaterial({
            color: 0xff4a14,
            emissive: 0xff2a00,
            emissiveIntensity: 1.8,
            roughness: 0.22,
            metalness: 0.12,
            transparent: true,
            opacity: 0.94,
        });
        const staff = new THREE.Group();
        const staffShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.026, 0.78, 7), staffWoodMat);
        staffShaft.position.y = 0.16;
        const staffGrip = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.024, 0.1, 7), staffIronMat);
        staffGrip.position.y = -0.16;
        const staffBand = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.028, 0.04, 8), staffIronMat);
        staffBand.position.y = 0.48;
        const staffCrystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.055, 0), staffCrystalMat);
        staffCrystal.position.y = 0.58;
        const staffGlow = new THREE.Mesh(
            new THREE.SphereGeometry(0.07, 10, 8),
            new THREE.MeshBasicMaterial({
                color: 0xff6622,
                transparent: true,
                opacity: 0.35,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
            }),
        );
        staffGlow.position.y = 0.58;
        const staffLight = new THREE.PointLight(0xff6a22, 0.7, 1.6, 2);
        staffLight.position.y = 0.58;
        const staffTip = new THREE.Object3D();
        staffTip.position.y = 0.62;
        staff.add(staffShaft, staffGrip, staffBand, staffCrystal, staffGlow, staffLight, staffTip);
        staff.position.set(0.28, -0.36, -0.46);
        staff.rotation.set(1.12, 0.22, -0.58);
        const staffBasePos = staff.position.clone();
        const staffBaseRot = staff.rotation.clone();
        camera.add(staff);

        const pillarMat = new THREE.MeshStandardMaterial({
            color: 0x9a9084,
            roughness: 0.72,
            metalness: 0.08,
        });
        const goldMat = new THREE.MeshStandardMaterial({
            color: 0xe2b84a,
            emissive: 0x6a4808,
            emissiveIntensity: 0.55,
            roughness: 0.28,
            metalness: 0.9,
        });

        const exitMesh = new THREE.Group();
        const pillarBase = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.24, 0.06, 12), pillarMat);
        pillarBase.position.y = 0.03;
        const pillarShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 0.34, 12), pillarMat);
        pillarShaft.position.y = 0.23;
        const pillarCap = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.12, 0.06, 12), pillarMat);
        pillarCap.position.y = 0.43;
        for (const part of [pillarBase, pillarShaft, pillarCap]) {
            part.castShadow = true;
            exitMesh.add(part);
        }

        const exitCrown = new THREE.Group();
        exitCrown.position.y = 0.48;
        const crownBand = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.125, 0.07, 12), goldMat);
        crownBand.position.y = 0.02;
        exitCrown.add(crownBand);
        const spikeGeo = new THREE.ConeGeometry(0.032, 0.15, 6);
        for (let i = 0; i < 5; i++) {
            const spike = new THREE.Mesh(spikeGeo, goldMat);
            const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
            spike.position.set(Math.cos(a) * 0.09, 0.12, Math.sin(a) * 0.09);
            spike.castShadow = true;
            exitCrown.add(spike);
        }
        const centerSpike = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.2, 6), goldMat);
        centerSpike.position.y = 0.16;
        centerSpike.castShadow = true;
        exitCrown.add(centerSpike);
        const jewel = new THREE.Mesh(new THREE.SphereGeometry(0.028, 10, 8), goldMat);
        jewel.position.y = 0.27;
        exitCrown.add(jewel);
        exitMesh.add(exitCrown);
        scene.add(exitMesh);

        const exitSpot = new THREE.SpotLight(0xffd078, 28, 6.5, Math.PI / 6, 0.4, 1.15);
        const exitTarget = new THREE.Object3D();
        exitSpot.target = exitTarget;
        scene.add(exitSpot);
        scene.add(exitTarget);

        function makeSpotBeam(topR, bottomR, height, opacity) {
            const geo = new THREE.CylinderGeometry(topR, bottomR, height, 24, 8, true);
            const pos = geo.attributes.position;
            const colors = new Float32Array(pos.count * 3);
            const tint = new THREE.Color(0xffe19a);
            for (let i = 0; i < pos.count; i++) {
                const y = pos.getY(i);
                const fade = Math.max(0, (y / height + 0.5) ** 1.6);
                colors[i * 3] = tint.r * fade;
                colors[i * 3 + 1] = tint.g * fade;
                colors[i * 3 + 2] = tint.b * fade;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const mat = new THREE.MeshBasicMaterial({
                vertexColors: true,
                transparent: true,
                opacity,
                side: THREE.DoubleSide,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.renderOrder = 2;
            mesh.frustumCulled = false;
            return mesh;
        }

        const spotAngle = Math.PI / 6;
        const beamTop = WALL_H - 0.05;
        const beamBottom = 0.05;
        const beamHeight = beamTop - beamBottom;
        const beamRadius = Math.tan(spotAngle) * beamHeight;
        const exitBeam = makeSpotBeam(0.025, beamRadius, beamHeight, 0.2);
        const exitBeamCore = makeSpotBeam(0.012, beamRadius * 0.42, beamHeight, 0.32);
        exitBeam.position.y = (beamTop + beamBottom) / 2;
        exitBeamCore.position.y = (beamTop + beamBottom) / 2;
        exitMesh.add(exitBeam);
        exitMesh.add(exitBeamCore);

        function makeStoneCanvas() {
            const size = 32;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2a2622';
            ctx.fillRect(0, 0, size, size);

            const palettes = [
                [118, 104, 90],
                [96, 86, 74],
                [132, 116, 98],
                [84, 76, 66],
                [108, 96, 82],
                [124, 112, 96],
                [90, 82, 70],
            ];
            const brickW = 16;
            const brickH = 8;
            const grout = 1;

            function paintBrick(x, y, pal, seed) {
                const shade = 0.82 + (seed % 8) * 0.03;
                const r = Math.min(255, pal[0] * shade);
                const g = Math.min(255, pal[1] * shade);
                const b = Math.min(255, pal[2] * shade);
                for (const ox of [0, size, -size]) {
                    for (const oy of [0, size, -size]) {
                        const dx = x + ox;
                        const dy = y + oy;
                        if (dx >= size || dy >= size || dx + brickW - grout <= 0 || dy + brickH - grout <= 0) {
                            continue;
                        }
                        ctx.fillStyle = `rgb(${r | 0},${g | 0},${b | 0})`;
                        ctx.fillRect(dx + grout, dy + grout, brickW - grout, brickH - grout);
                        ctx.fillStyle = 'rgba(0,0,0,0.18)';
                        ctx.fillRect(dx + grout, dy + brickH - 1, brickW - grout, 1);
                        ctx.fillStyle = 'rgba(255,255,255,0.08)';
                        ctx.fillRect(dx + grout, dy + grout, brickW - grout, 1);
                    }
                }
            }

            let row = 0;
            for (let y = 0; y < size; y += brickH) {
                const offset = (row % 2) * (brickW / 2);
                for (let x = -offset; x < size; x += brickW) {
                    const seed = Math.abs((x * 13 + y * 7 + row * 17) | 0);
                    paintBrick(x, y, palettes[seed % palettes.length], seed);
                }
                row += 1;
            }

            const img = ctx.getImageData(0, 0, size, size);
            for (let i = 0; i < img.data.length; i += 4) {
                const n = ((i * 17) % 9) - 4;
                img.data[i] = Math.max(0, Math.min(255, img.data[i] + n));
                img.data[i + 1] = Math.max(0, Math.min(255, img.data[i + 1] + n));
                img.data[i + 2] = Math.max(0, Math.min(255, img.data[i + 2] + n));
            }
            ctx.putImageData(img, 0, 0);
            return canvas;
        }

        function drawVines(ctx, size) {
            const stems = ['#1d4a1a', '#245820', '#2f6b28'];
            const leaves = ['#2e6e28', '#3d8a32', '#52a83e', '#6cbc4a'];

            function px(x, y, color) {
                const dx = ((x % size) + size) % size;
                if (y < 0 || y >= size) {
                    return;
                }
                ctx.fillStyle = color;
                ctx.fillRect(dx, y, 1, 1);
            }

            function leaf(x, y, seed) {
                px(x, y, leaves[seed % leaves.length]);
                if (seed % 2 === 0) {
                    px(x + 1, y, leaves[(seed + 1) % leaves.length]);
                }
                if (seed % 3 !== 1) {
                    px(x, y + 1, leaves[(seed + 2) % leaves.length]);
                }
                if (seed % 4 === 0) {
                    px(x - 1, y, '#245820');
                }
                if (seed % 5 === 0) {
                    px(x + 1, y - 1, '#7ad055');
                }
            }

            const vines = [
                { x: 3, lean: 1, len: 32 },
                { x: 11, lean: -1, len: 26 },
                { x: 18, lean: 1, len: 30 },
                { x: 27, lean: -1, len: 22 },
            ];
            for (const vine of vines) {
                let x = vine.x;
                for (let y = 0; y < vine.len; y++) {
                    px(x, y, stems[(x + y) % stems.length]);
                    px(x, y + 1, stems[(x + y + 1) % stems.length]);
                    if ((y + vine.x) % 3 === 0) {
                        leaf(x + vine.lean, y, x * 5 + y);
                    }
                    if ((y + vine.x) % 4 === 0) {
                        leaf(x - vine.lean, y + 1, y * 7 + vine.x);
                    }
                    if (y > 2 && (y * 3 + vine.x) % 5 === 0) {
                        x += vine.lean;
                    }
                }
            }

            for (let i = 0; i < 10; i++) {
                leaf(4 + ((i * 11) % 24), 2 + ((i * 5) % 8), i * 13);
            }
        }

        function makeCobwebCanvas() {
            const size = 64;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            function px(x, y, a = 0.78) {
                if (x < 0 || y < 0 || x >= size || y >= size) {
                    return;
                }
                ctx.fillStyle = `rgba(236,232,222,${a})`;
                ctx.fillRect(x | 0, y | 0, 1, 1);
            }

            function spoke(x0, y0, x1, y1, a) {
                const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
                for (let i = 0; i <= n; i++) {
                    const t = i / Math.max(1, n);
                    const jag = i % 6 === 2 ? 1 : i % 6 === 5 ? -1 : 0;
                    px(x0 + (x1 - x0) * t + jag, y0 + (y1 - y0) * t, a);
                }
            }

            for (let i = 0; i < 9; i++) {

            for (let i = 0; i < 7; i++) {

        function makeHangingPlantCanvas() {
            const size = 64;

                if (x < 0 || y < 0 || x >= size || y >= size) {
                    return;
                }
                ctx.fillStyle = color;
                ctx.fillRect(x, y, 1, 1);
            }

            function tuft(cx, cy, r, seed) {
                for (let i = 0; i < 18; i++) {
                    const a = (seed * 0.7 + i * 0.7) % 6.28;
                    const len = r * (0.45 + (i % 4) * 0.16);
                    for (let t = 0; t < len; t++) {
                        px(cx + Math.cos(a) * t, cy + Math.sin(a) * t * 1.15, leaves[(seed + i + t) % leaves.length]);

            for (let i = 0; i < 7; i++) {
                const x = 6 + i * 8;
                for (let y = 0; y < 18 + (i % 5) * 6; y++) {
                    px(x + ((y % 6 === 0) ? 1 : 0), y, stems[(x + y) % stems.length]);
                }
                tuft(x, 14 + (i % 3) * 8, 7 + (i % 4), i * 11);

        function drawCracks(ctx, size) {
            function px(x, y, color) {
                const dx = ((x % size) + size) % size;
                if (y < 0 || y >= size) {
                    return;
                }
                ctx.fillStyle = color;
                ctx.fillRect(dx, y, 1, 1);
            }

            function crack(x0, y0, x1, y1, dark, edge) {
                const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
                for (let i = 0; i <= steps; i++) {
                    const t = i / Math.max(1, steps);
                    const x = Math.round(x0 + (x1 - x0) * t);
                    const y = Math.round(y0 + (y1 - y0) * t);
                    const jag = (i % 3 === 0) ? 1 : 0;
                    px(x + jag, y, dark);
                    px(x + jag + 1, y, edge);
                    if (i % 4 === 0) {
                        px(x + jag, y + 1, dark);
                    }
                    if (i % 5 === 2) {
                        px(x + jag - 1, y, edge);
                    }
                }
            }

            const dark = '#14110e';
            const edge = '#3a332c';
            crack(3, 2, 10, 18, dark, edge);
            crack(10, 18, 8, 31, dark, edge);
            crack(18, 1, 28, 14, dark, edge);
            crack(22, 12, 31, 22, dark, edge);
            crack(14, 8, 20, 24, dark, edge);
            crack(1, 22, 12, 28, dark, edge);

            for (let n = 0; n < 18; n++) {
                px((n * 9 + 4) % size, (n * 5 + 11) % size, n % 2 ? dark : '#1c1814');
            }
        }

        function makeStainedGlassCanvas(variant) {
            const size = 64;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const gems = [
                ['#8b1e2d', '#1e3a8a', '#c9a227', '#1f6b3a', '#5b21b6', '#9a3412'],
                ['#be123c', '#1e40af', '#eab308', '#15803d', '#6d28d9', '#c2410c'],
                ['#7f1d1d', '#172554', '#a16207', '#14532d', '#4c1d95', '#7c2d12'],
            ][variant % 3];
            ctx.fillStyle = '#140e0a';
            ctx.fillRect(0, 0, size, size);
            const cols = 4;
            const rows = 5;
            const lead = 3;
            const cellW = (size - lead) / cols;
            const cellH = (size - lead) / rows;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const i = r * cols + c + variant * 5;
                    const x = Math.round(lead + c * cellW);
                    const y = Math.round(lead + r * cellH);
                    const w = Math.round(cellW - lead);
                    const h = Math.round(cellH - lead);
                    ctx.fillStyle = gems[i % gems.length];
                    ctx.fillRect(x, y, w, h);
                    ctx.fillStyle = gems[(i + 2) % gems.length];
                    ctx.fillRect(x + 2, y + 2, Math.max(2, w - 5), Math.max(2, h - 5));
                    ctx.fillStyle = 'rgba(255,255,230,0.28)';
                    ctx.fillRect(x + 1, y + 1, Math.max(1, (w / 3) | 0), 1);
                    ctx.fillRect(x + 1, y + 2, 1, Math.max(1, (h / 3) | 0));
                }
            }
            ctx.fillStyle = '#140e0a';
            ctx.fillRect((size / 2) - 2, 0, 4, size);
            ctx.fillRect(0, (size / 2) - 2, size, 4);
            ctx.fillRect(0, 0, size, 3);
            ctx.fillRect(0, size - 3, size, 3);
            ctx.fillRect(0, 0, 3, size);
            ctx.fillRect(size - 3, 0, 3, size);
            return canvas;
        }

        function makeFloorCanvas(kind) {
            const size = 32;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const seam = String(kind).match(/^(dirt|plank|stone)-(stone|dirt|plank)-(edge|corner|end)$/);
            const paintKind = seam ? (seam[1] === 'stone' ? 'flag' : seam[1]) : kind;

            function px(x, y, color) {
                ctx.fillStyle = color;
                ctx.fillRect(((x % size) + size) % size, ((y % size) + size) % size, 1, 1);
            }

            function paintFamily(ix, iy, family) {
                if (family === 'dirt') {
                    const dirt = ['#3a2a1c', '#4a3624', '#2e2218', '#5a4030', '#241810'];
                    px(ix, iy, dirt[(ix * 11 + iy * 17) % dirt.length]);
                    return;
                }
                if (family === 'plank') {
                    const boards = [[86, 62, 38], [102, 74, 46], [74, 54, 34], [94, 68, 42]];
                    const pal = boards[Math.floor(iy / 8) % boards.length];
                    const shade = 0.88 + (Math.floor(iy / 8) % 4) * 0.04;
                    ctx.fillStyle = `rgb(${(pal[0] * shade) | 0},${(pal[1] * shade) | 0},${(pal[2] * shade) | 0})`;
                    ctx.fillRect(ix, iy, 1, 1);
                    return;
                }
                const pal = [[92, 82, 70], [108, 96, 82], [80, 72, 62], [118, 104, 88]];
                const onGrout = ix % 16 === 0 || iy % 16 === 0 || ix % 16 === 15 || iy % 16 === 15;
                if (onGrout) {
                    px(ix, iy, '#1a1613');
                    return;
                }
                const p = pal[(ix + iy * 3) % pal.length];
                const shade = 0.86 + ((ix * 9 + iy * 5) % 7) * 0.03;
                px(ix, iy, `rgb(${(p[0] * shade) | 0},${(p[1] * shade) | 0},${(p[2] * shade) | 0})`);
            }

            function blendEdge(side, family) {
                for (let i = 0; i < size; i++) {
                    const depth = 4 + ((i * 13 + side * 7) % 6);
                    for (let d = 0; d < depth; d++) {
                        if (d > 2 && ((i * 9 + d * 5 + side) % 4) === 0) {
                            continue;
                        }
                        let ix = i;
                        let iy = d;
                        if (side === 1) {
                            ix = size - 1 - d;
                            iy = i;
                        } else if (side === 2) {
                            ix = i;
                            iy = size - 1 - d;
                        } else if (side === 3) {
                            ix = d;
                            iy = i;
                        }
                        paintFamily(ix, iy, family);
                    }
                }
            }

            if (paintKind === 'dirt') {
                ctx.fillStyle = '#2a2016';
                ctx.fillRect(0, 0, size, size);
                const dirt = ['#3a2a1c', '#4a3624', '#2e2218', '#5a4030', '#241810'];
                for (let n = 0; n < 220; n++) {
                    px((n * 11 + 3) % size, (n * 17 + 7) % size, dirt[n % dirt.length]);
                }
            } else if (paintKind === 'plank') {
                ctx.fillStyle = '#1a120c';
                ctx.fillRect(0, 0, size, size);
                const boards = [
                    [86, 62, 38], [102, 74, 46], [74, 54, 34], [94, 68, 42],
                ];
                const bh = 8;
                for (let y = 0, i = 0; y < size; y += bh, i += 1) {
                    const pal = boards[i % boards.length];
                    const shade = 0.88 + (i % 4) * 0.04;
                    ctx.fillStyle = `rgb(${(pal[0] * shade) | 0},${(pal[1] * shade) | 0},${(pal[2] * shade) | 0})`;
                    ctx.fillRect(0, y + 1, size, bh - 1);
                    ctx.fillStyle = 'rgba(0,0,0,0.28)';
                    ctx.fillRect(0, y, size, 1);
                    ctx.fillStyle = 'rgba(255,255,255,0.06)';
                    ctx.fillRect(0, y + 1, size, 1);
                }
            } else {
                const grout = paintKind === 'moss' ? '#1c2a18' : '#1a1613';
                ctx.fillStyle = grout;
                ctx.fillRect(0, 0, size, size);

                const palettes = {
                    flag: [[92, 82, 70], [108, 96, 82], [80, 72, 62], [118, 104, 88]],
                    worn: [[86, 76, 64], [100, 88, 74], [72, 64, 54], [94, 84, 70]],
                    moss: [[78, 80, 62], [90, 86, 68], [70, 76, 58], [102, 94, 72]],
                    dark: [[58, 52, 46], [70, 62, 54], [48, 44, 40], [64, 58, 50]],
                    gravel: [[84, 74, 62], [96, 86, 72], [74, 66, 56], [108, 96, 80]],
                }[paintKind] || [[92, 82, 70], [108, 96, 82], [80, 72, 62], [118, 104, 88]];

                const tile = paintKind === 'gravel' ? 8 : 16;
                const gap = 1;
                let i = 0;
                for (let y = 0; y < size; y += tile) {
                    for (let x = 0; x < size; x += tile) {
                        const pal = palettes[(x / tile + (y / tile) * 3 + i) % palettes.length];
                        const shade = 0.86 + ((x * 9 + y * 5 + i * 13) % 7) * 0.03;
                        ctx.fillStyle = `rgb(${(pal[0] * shade) | 0},${(pal[1] * shade) | 0},${(pal[2] * shade) | 0})`;
                        ctx.fillRect(x + gap, y + gap, tile - gap, tile - gap);
                        ctx.fillStyle = 'rgba(255,255,255,0.06)';
                        ctx.fillRect(x + gap, y + gap, tile - gap, 1);
                        ctx.fillStyle = 'rgba(0,0,0,0.16)';
                        ctx.fillRect(x + gap, y + tile - 1, tile - gap, 1);
                        i += 1;
                    }
                }

                if (paintKind === 'worn') {
                    const cracks = [
                        [4, 6], [5, 7], [6, 8], [7, 9], [8, 11],
                        [18, 3], [19, 4], [20, 6], [21, 8],
                        [10, 20], [11, 21], [12, 22], [13, 24], [14, 25],
                    ];
                    for (const [x, y] of cracks) {
                        px(x, y, '#151210');
                        px(x + 1, y, '#2a241e');
                    }
                }

                if (paintKind === 'moss') {
                    const moss = ['#2a5c24', '#3d7a32', '#4a8f38', '#1e4a1c'];
                    for (let n = 0; n < 70; n++) {
                        const x = (n * 11 + 3) % size;
                        const y = (n * 17 + 5) % size;
                        const onGrout = x % 16 === 0 || y % 16 === 0 || x % 16 === 15 || y % 16 === 15;
                        if (onGrout || n % 4 === 0) {
                            px(x, y, moss[n % moss.length]);
                            if (n % 3 === 0) {
                                px(x + 1, y, moss[(n + 1) % moss.length]);
                            }
                        }
                    }
                }

                if (paintKind === 'gravel') {
                    for (let n = 0; n < 40; n++) {
                        px((n * 7) % size, (n * 13) % size, n % 2 ? '#5a4e42' : '#3a322c');
                    }
                }
            }

            if (seam) {
                const other = seam[2];
                const shape = seam[3];
                blendEdge(0, other);
                if (shape === 'corner') {
                    blendEdge(1, other);
                } else if (shape === 'end') {
                    blendEdge(2, other);
                }
            }

            const img = ctx.getImageData(0, 0, size, size);
            for (let p = 0; p < img.data.length; p += 4) {
                const n = ((p * 13) % 7) - 3;
                img.data[p] = Math.max(0, Math.min(255, img.data[p] + n));
                img.data[p + 1] = Math.max(0, Math.min(255, img.data[p + 1] + n));
                img.data[p + 2] = Math.max(0, Math.min(255, img.data[p + 2] + n));
            }
            ctx.putImageData(img, 0, 0);
            return canvas;
        }

            const prefix = `${floorFamily(kind)}-${other}`;
            const singles = { 1: 0, 2: 3, 4: 2, 8: 1 };
            if (singles[bits] != null) {
                return { kind: `${prefix}-edge`, rot: singles[bits] };
            }
            const corners = { 3: 0, 6: 3, 12: 2, 9: 1 };
            if (corners[bits] != null) {
                return { kind: `${prefix}-corner`, rot: corners[bits] };
            }
            if (bits === 5) {
                return { kind: `${prefix}-end`, rot: 0 };
            }
            if (bits === 10) {
                return { kind: `${prefix}-end`, rot: 1 };
            }
            if ((bits & 3) === 3) {
                return { kind: `${prefix}-corner`, rot: 0 };
            }
            if ((bits & 6) === 6) {
                return { kind: `${prefix}-corner`, rot: 3 };
            }
            if ((bits & 12) === 12) {

            }

        function releaseGpu(root) {
            if (!root) {

            const seenGeo = new Set();
            const seenMat = new Set();
            root.traverse((obj) => {
                if (obj.isInstancedMesh && typeof obj.dispose === 'function') {
                    obj.dispose();
                }
                if (obj.geometry && !SHARED_GEOS.has(obj.geometry) && !seenGeo.has(obj.geometry)) {
                    seenGeo.add(obj.geometry);
                    obj.geometry.dispose();
                }
                const mats = obj.material ? (Array.isArray(obj.material) ? obj.material : [obj.material]) : [];
                for (const mat of mats) {
                    if (!mat || SHARED_MATS.has(mat) || seenMat.has(mat)) {
                        continue;
                    }
                    seenMat.add(mat);
                    mat.dispose();

            });
        }

        function updateFx(dt) {

                if (fx.kind === 'bolt') {
                    fx.t += dt / fx.duration;
                    if (fx.t >= 1) {
                        const pos = fx.end.clone();
                        disposeObject(fx.group);
                        fxItems.splice(i, 1);
                        spawnExplosion(pos);
                    } else {
                        fx.group.position.lerpVectors(fx.start, fx.end, fx.t);
                        fx.group.lookAt(fx.end);
                        fx.light.intensity = 3.2 + Math.sin(clock.elapsedTime * 40) * 0.5;
                    }
                    continue;
                }

                fx.t += dt;
                const u = Math.min(1, fx.t / fx.duration);
                if (fx.kind === 'ghost') {
                    const fade = 1 - u;
                    fx.core.scale.setScalar(1 + u * 8.5);
                    fx.glow.scale.setScalar(2.4 + u * 9);
                    fx.core.material.opacity = 0.95 * fade * fade;
                    fx.glow.material.opacity = 0.78 * fade;
                    fx.light.intensity = 10 * fade * fade;
                    for (const spark of fx.sparks) {
                        spark.vel.y += 1.1 * dt;
                        spark.vel.multiplyScalar(Math.exp(-dt * 1.8));
                        spark.mesh.position.addScaledVector(spark.vel, dt);
                        spark.mesh.material.opacity = fade;
                        spark.mesh.scale.multiplyScalar(Math.exp(-dt * 1.4));
                    }
                } else {
                    fx.core.scale.setScalar(1 + u * 5.5);
                    fx.glow.scale.setScalar(1.6 + u * 6);
                    fx.core.material.opacity = 0.95 * (1 - u);
                    fx.glow.material.opacity = 0.7 * (1 - u);
                    fx.light.intensity = 12 * (1 - u) * (1 - u);
                    for (const spark of fx.sparks) {
                        spark.vel.y -= 4.2 * dt;
                        spark.mesh.position.addScaledVector(spark.vel, dt);
                        spark.mesh.material.opacity = 1 - u;
                        spark.mesh.scale.setScalar(1 - u * 0.6);
                    }
                }
                if (u >= 1) {
                    disposeObject(fx.group);
                    fxItems.splice(i, 1);
                }
            }
        }

        function updateTorchEmbers(dt) {
            const n = torchEmitters.length;
            if (!n) {
                if (emberAlphas[0] !== 0) {
                    resetTorchEmbers();
                }
                return;
            }

            const t = clock.elapsedTime;
            const active = Math.min(TORCH_EMBER_COUNT, n * 8);
            for (let i = 0; i < torchMeshes.length; i += 1) {
                const torch = torchMeshes[i];
                const flicker = 1 + Math.sin(t * 17 + i * 2.3) * 0.14 + Math.sin(t * 29 + i * 1.1) * 0.08;
                torch.userData.flame.scale.set(0.85 + flicker * 0.2, flicker, 0.85 + flicker * 0.2);
                torch.userData.tip.scale.set(0.8 + flicker * 0.15, 0.75 + flicker * 0.45, 0.8 + flicker * 0.15);
            }

            for (let i = 0; i < TORCH_EMBER_COUNT; i += 1) {
                const ember = emberState[i];
                if (i >= active) {
                    emberAlphas[i] = 0;
                    continue;
                }
                ember.age += dt;
                if (ember.age >= ember.life) {
                    spawnTorchEmber(ember, torchEmitters[i % n]);
                }
                const swirl = Math.sin(t * 6 + ember.seed) * 0.03;
                ember.vx += swirl * dt;
                ember.vy += 0.08 * dt;
                ember.x += ember.vx * dt;
                ember.y += ember.vy * dt;
                ember.z += ember.vz * dt;

                const u = Math.min(1, ember.age / ember.life);
                const fade = u < 0.12 ? u / 0.12 : 1 - (u - 0.12) / 0.88;
                const heat = 1 - u;
                const r = torchCool.r + (torchHot.r - torchCool.r) * heat;
                const g = torchCool.g + (torchHot.g - torchCool.g) * heat;
                const b = torchCool.b + (torchHot.b - torchCool.b) * heat;
                emberPositions[i * 3] = ember.x;
                emberPositions[i * 3 + 1] = ember.y;
                emberPositions[i * 3 + 2] = ember.z;
                emberColors[i * 3] = r + heat * 0.35;
                emberColors[i * 3 + 1] = g + heat * 0.22;
                emberColors[i * 3 + 2] = b;
                emberSizes[i] = ember.size * (0.65 + heat * 0.7);
                emberAlphas[i] = Math.max(0, fade) * (0.45 + heat * 0.55);
            }
            emberGeo.attributes.position.needsUpdate = true;
            emberGeo.attributes.color.needsUpdate = true;
            emberGeo.attributes.aSize.needsUpdate = true;
            emberGeo.attributes.aAlpha.needsUpdate = true;

        function updateMushroomSpores(dt) {
            const n = mushroomEmitters.length;
            if (!n) {
                if (sporeAlphas[0] !== 0) {
                    resetMushroomSpores();
                }
                return;
            }

            const t = clock.elapsedTime;
            const pulse = 0.95 + Math.sin(t * 2.1) * 0.22;
            mushCapMats[0].emissiveIntensity = 0.9 + Math.sin(t * 1.7) * 0.2;
            mushCapMats[1].emissiveIntensity = 1.05 + Math.sin(t * 2.0 + 0.8) * 0.22;
            mushCapMats[2].emissiveIntensity = 1.1 + Math.sin(t * 1.85 + 1.4) * 0.24;
            mushGlowMat.opacity = 0.22 + Math.sin(t * 2.4) * 0.08;
            for (let i = 0; i < mushroomLights.length; i += 1) {
                const light = mushroomLights[i];
                light.intensity = light.userData.base * (0.82 + Math.sin(t * 1.8 + i * 1.3) * 0.18);
            }

            const active = Math.min(MUSHROOM_SPORE_COUNT, n * 6);
            for (let i = 0; i < MUSHROOM_SPORE_COUNT; i += 1) {
                const spore = sporeState[i];
                if (i >= active) {
                    sporeAlphas[i] = 0;
                    continue;
                }
                spore.age += dt;
                if (spore.age >= spore.life) {
                    spawnMushroomSpore(spore, mushroomEmitters[i % n]);
                }
                const drift = Math.sin(t * 1.4 + spore.seed) * 0.02;
                spore.vx += drift * dt;
                spore.x += spore.vx * dt;
                spore.y += spore.vy * dt;
                spore.z += spore.vz * dt;

                const u = Math.min(1, spore.age / spore.life);
                const fade = u < 0.18 ? u / 0.18 : 1 - (u - 0.18) / 0.82;
                const heat = 1 - u * 0.65;
                const g = sporeGreen.g + (sporeBlue.g - sporeGreen.g) * spore.mix;
                const r = sporeGreen.r + (sporeBlue.r - sporeGreen.r) * spore.mix + heat * 0.18;
                const b = sporeGreen.b + (sporeBlue.b - sporeGreen.b) * spore.mix + heat * 0.12;
                sporePositions[i * 3] = spore.x;
                sporePositions[i * 3 + 1] = spore.y;
                sporePositions[i * 3 + 2] = spore.z;
                sporeColors[i * 3] = r + heat * 0.12;
                sporeColors[i * 3 + 1] = g + heat * 0.08;
                sporeColors[i * 3 + 2] = b;
                sporeSizes[i] = spore.size * (0.85 + heat * 0.5) * pulse;
                sporeAlphas[i] = Math.max(0, fade) * 0.42;
            }
            sporeGeo.attributes.position.needsUpdate = true;
            sporeGeo.attributes.color.needsUpdate = true;
            sporeGeo.attributes.aSize.needsUpdate = true;
            sporeGeo.attributes.aAlpha.needsUpdate = true;

        function clearArtworkClips() {
            for (const clip of artworkClips.values()) {

        function isGifBytes(bytes) {
            return bytes.length >= 6 && bytes[0] === 0x47 && bytes[1] === 0x49 && bytes[2] === 0x46;
        }

        function makeCanvasTexture(canvas) {
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.generateMipmaps = false;
            return texture;
        }

        function finishClip(clip, texture) {
            clip.texture = texture;
            clip.ready = true;
            for (const apply of clip.waiters) {
                apply(texture);
            }
            clip.waiters = [];
        }

        function failClip(clip) {
            clip.failed = true;
            for (const apply of clip.waiters) {
                apply(null);
            }
            clip.waiters = [];
        }

        function paintGifFrame(clip, index) {
            const frame = clip.frames[index];
            const dims = frame.dims;
            if (index === 0) {
                clip.fullCtx.clearRect(0, 0, clip.full.width, clip.full.height);
                clip.prevDisposal = 0;
                clip.backup = null;
            } else if (clip.prevDisposal === 2 && clip.prevDims) {
                clip.fullCtx.clearRect(clip.prevDims.left, clip.prevDims.top, clip.prevDims.width, clip.prevDims.height);
            } else if (clip.prevDisposal === 3 && clip.backup) {
                clip.fullCtx.putImageData(clip.backup, 0, 0);
            }
            if (frame.disposalType === 3) {
                clip.backup = clip.fullCtx.getImageData(0, 0, clip.full.width, clip.full.height);
            }
            clip.patch.width = dims.width;
            clip.patch.height = dims.height;
            clip.patchCtx = clip.patch.getContext('2d');
            const imageData = clip.patchCtx.createImageData(dims.width, dims.height);
            imageData.data.set(frame.patch);
            clip.patchCtx.putImageData(imageData, 0, 0);
            clip.fullCtx.drawImage(clip.patch, dims.left, dims.top);
            clip.prevDisposal = frame.disposalType;
            clip.prevDims = dims;
            clip.ctx.clearRect(0, 0, clip.canvas.width, clip.canvas.height);
            clip.ctx.drawImage(clip.full, 0, 0, clip.canvas.width, clip.canvas.height);
        }

        function setupGifClip(clip, buffer) {
            const gif = parseGIF(buffer);
            const frames = decompressFrames(gif, true);
            if (!frames.length) {
                throw new Error('empty gif');
            }
            const width = gif.lsd?.width || frames[0].dims.width;
            const height = gif.lsd?.height || frames[0].dims.height;
            const max = 512;
            const scale = Math.min(1, max / Math.max(width, height));
            clip.full = document.createElement('canvas');
            clip.full.width = width;
            clip.full.height = height;
            clip.fullCtx = clip.full.getContext('2d', { willReadFrequently: true });
            clip.patch = document.createElement('canvas');
            clip.patchCtx = clip.patch.getContext('2d');
            clip.canvas = document.createElement('canvas');
            clip.canvas.width = Math.max(1, Math.round(width * scale));
            clip.canvas.height = Math.max(1, Math.round(height * scale));
            clip.ctx = clip.canvas.getContext('2d');
            clip.frames = frames;
            clip.index = 0;
            clip.elapsed = 0;
            clip.animated = frames.length > 1;
            clip.prevDisposal = 0;
            clip.prevDims = null;
            clip.backup = null;
            clip.aspect = width / Math.max(1, height);
            paintGifFrame(clip, 0);
            finishClip(clip, makeCanvasTexture(clip.canvas));
        }

        function setupStaticClip(clip, buffer, type) {
            const blob = new Blob([buffer], { type: type || 'image/png' });
            clip.objectUrl = URL.createObjectURL(blob);
            const img = new Image();
            clip.img = img;
            img.addEventListener('error', () => failClip(clip));
            img.addEventListener('load', () => {
                const max = 512;
                const scale = Math.min(1, max / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
                clip.canvas = document.createElement('canvas');
                clip.canvas.width = Math.max(1, Math.round((img.naturalWidth || 1) * scale));
                clip.canvas.height = Math.max(1, Math.round((img.naturalHeight || 1) * scale));
                clip.ctx = clip.canvas.getContext('2d');
                clip.ctx.drawImage(img, 0, 0, clip.canvas.width, clip.canvas.height);
                clip.aspect = (img.naturalWidth || 1) / (img.naturalHeight || 1);
                clip.animated = false;
                finishClip(clip, makeCanvasTexture(clip.canvas));
            });
            img.src = clip.objectUrl;
        }

        function artworkClip(url) {
            const existing = artworkClips.get(url);
            if (existing) {
                return existing;
            }
            const clip = {
                url,
                ready: false,
                failed: false,
                animated: false,
                waiters: [],
            };
            artworkClips.set(url, clip);
            fetch(url)
                .then((res) => {
                    if (!res.ok) {
                        throw new Error('artwork fetch failed');
                    }
                    return Promise.all([res.arrayBuffer(), res.headers.get('content-type')]);
                })
                .then(([buffer, type]) => {
                    const bytes = new Uint8Array(buffer);
                    if (isGifBytes(bytes)) {
                        setupGifClip(clip, buffer);
                        return;
                    }
                    setupStaticClip(clip, buffer, type);
                })
                .catch(() => failClip(clip));
            return clip;
        }

        function sizePainting(frame, plane, aspect, hash) {
            const ar = aspect > 0.05 && Number.isFinite(aspect) ? aspect : 4 / 3;
            const border = 0.04;
            const maxW = CELL * 0.8 - border * 2;
            const maxH = WALL_H * 0.8 - border * 2;
            let width;
            let height;
            if (ar >= maxW / maxH) {
                width = maxW;
                height = maxW / ar;
            } else {
                height = maxH;
                width = maxH * ar;
            }
            const scale = 0.5 + (Math.abs(hash) % 11) * (0.5 / 10);
            width *= scale;
            height *= scale;
            plane.scale.set(width, height, 1);
            frame.scale.set(width + border * 2, height + border * 2, 1);
        }

        function bindArtwork(planeMat, url, frame, plane, hash) {
            const clip = artworkClip(url);
            const apply = (tex) => {
                if (!tex) {
                    planeMat.map = null;
                    planeMat.color.set(0xc41818);
                    sizePainting(frame, plane, 4 / 3, hash);
                } else {
                    planeMat.map = tex;
                    planeMat.color.set(0xffffff);
                    sizePainting(frame, plane, clip.aspect, hash);
                }
                planeMat.needsUpdate = true;
            };
            if (clip.failed) {
                apply(null);
                return;
            }
            if (clip.ready) {
                apply(clip.texture);
                return;
            }
            clip.waiters.push(apply);
        }

        function gifDelay(frame) {
            return frame.delay > 0 ? Math.max(20, frame.delay) : 100;
        }

        function updateArtworkClips(dt) {
            const ms = dt * 1000;
            for (const clip of artworkClips.values()) {
                if (!clip.animated || !clip.ready || !clip.frames || clip.frames.length < 2) {
                    continue;
                }
                clip.elapsed += ms;
                let delay = gifDelay(clip.frames[clip.index]);
                let steps = 0;
                while (clip.elapsed >= delay && steps < clip.frames.length) {
                    clip.elapsed -= delay;
                    clip.index = (clip.index + 1) % clip.frames.length;
                    paintGifFrame(clip, clip.index);
                    clip.texture.needsUpdate = true;
                    delay = gifDelay(clip.frames[clip.index]);
                    steps += 1;
                }
            }
        }

        function syncEnemies(state, snap) {
            if (!enemyRoot) {
                enemyRoot = new THREE.Group();
                scene.add(enemyRoot);
            }
            const live = new Set();
            for (const enemy of state.enemies || []) {
                live.add(enemy.id);
                let actor = enemyActors.get(enemy.id);
                if (!actor) {
                    const group = enemy.kind === 'ghost' ? makeGhost() : makeGoblin();
                    group.position.set(enemy.x * CELL, PROP_LIFT, enemy.y * CELL);
                    enemyRoot.add(group);
                    actor = {
                        group,
                        kind: enemy.kind,
                        tx: enemy.x * CELL,
                        tz: enemy.y * CELL,
                        dying: false,
                        dieAt: 0,
                    };
                    enemyActors.set(enemy.id, actor);
                }
                actor.tx = enemy.x * CELL;
                actor.tz = enemy.y * CELL;
                if (snap) {
                    actor.group.position.x = actor.tx;
                    actor.group.position.z = actor.tz;
                }
            }
            for (const [id, actor] of enemyActors) {
                if (!live.has(id) && !actor.dying) {
                    actor.dying = true;
                    actor.dieAt = clock.elapsedTime;
                    if (actor.kind === 'ghost') {
                        spawnGhostBurst(new THREE.Vector3(
                            actor.group.position.x,
                            actor.group.position.y + 0.48,
                            actor.group.position.z,
                        ));
                    } else if (actor.kind === 'goblin') {
                        dropBloodStain(actor.group.position.x, actor.group.position.z);
                    }
                }
            }
        }

        function updateEnemies(dt, t) {
            const now = clock.elapsedTime;
            for (const [id, actor] of [...enemyActors]) {
                actor.group.position.x += (actor.tx - actor.group.position.x) * t;
                actor.group.position.z += (actor.tz - actor.group.position.z) * t;
                if (actor.kind === 'ghost') {
                    actor.group.position.y = PROP_LIFT + 0.08 + Math.sin(now * 2.4 + (actor.group.userData.bob || 0)) * 0.05;
                } else {
                    actor.group.lookAt(targetPos.x, actor.group.position.y, targetPos.z);
                    actor.group.rotateY(Math.PI);
                }
                if (actor.dying) {
                    const pop = actor.kind === 'ghost' ? 0.12 : 0.22;
                    const fade = Math.max(0, 1 - (now - actor.dieAt) / pop);
                    actor.group.scale.setScalar(Math.max(0.05, fade));
                    if (fade <= 0) {
                        enemyRoot.remove(actor.group);
                        disposeObject(actor.group);
                        enemyActors.delete(id);
                    }
                }
            }
        }

        function isWalkable(cell) {
            return cell === 0 || cell === 2 || cell === DOOR_TILE;
        }

        function isFloorTile(cell) {
            return cell === 0 || cell === 2 || cell === FURNITURE || cell === DOOR_TILE;
        }

        function isCeilTile(cell) {
            return isFloorTile(cell) || cell === WATER_TILE || cell === SPIKE_TILE;
        }

        function isFullWall(cell) {
            return cell === FULL_WALL;
        }

        function isWallLike(cell) {
            return cell === FULL_WALL || cell === HALF_WALL || cell === BROKEN_WALL
                || cell === HOLE_WALL || cell === FENCE_WALL || cell === WINDOW_WALL || cell === BREACH_WALL;
        }

        function faceKey(wx, wz, dx, dz) {

        function collectFaces(grid, width, height) {
            const faces = [];
            for (let z = 0; z < height; z++) {
                for (let x = 0; x < width; x++) {
                    const cell = grid[z][x];
                    if (!isWalkable(cell) || cell === DOOR_TILE) {
                        continue;
                    }
                    for (let d = 0; d < 4; d++) {
                        const { dx, dz } = WALL_DIRS[d];
                        const wx = x + dx;
                        const wz = z + dz;
                        if (!isFullWall(grid[wz]?.[wx])) {
                            continue;
                        }
                        faces.push({
                            x,
                            z,
                            wx,
                            wz,
                            dx,
                            dz,
                            hash: Math.abs(x * 17 + z * 23 + d * 41),
                            propHash: Math.abs(x * 19 + z * 31 + d * 43),
                        });
                    }
                }
            }
            return faces;
        }

        function isReservedCell(x, z, player, exit) {
            if (player && player.x === x && player.y === z) {
                return true;
            }
            if (exit && exit.x === x && exit.y === z) {
                return true;
            }
            return false;
        }

        function makeMushroom(hash, blueBias) {
            const group = new THREE.Group();
            const count = 1 + (hash % 4);
            let maxY = 0;
            for (let i = 0; i < count; i += 1) {
                const stemH = 0.07 + ((hash + i * 9) % 6) * 0.018;
                const capR = 0.042 + ((hash + i * 5) % 7) * 0.007;
                const x = ((i % 2) * 2 - 1) * (0.03 + (i % 3) * 0.018);
                const z = (i < 2 ? -0.5 : 0.5) * (0.04 + (i % 2) * 0.02);
                const stem = new THREE.Mesh(mushStemGeo, mushStemMat);
                stem.scale.set(0.85 + (i % 3) * 0.12, stemH, 0.85 + (i % 3) * 0.12);
                stem.position.set(x, stemH / 2, z);
                const cap = new THREE.Mesh(mushCapGeo, mushCapMats[(hash + i + blueBias) % mushCapMats.length]);
                cap.scale.set(capR, capR * 0.4, capR);
                cap.position.set(x, stemH + capR * 0.12, z);
                const glow = new THREE.Mesh(mushGlowGeo, mushGlowMat);
                glow.scale.setScalar(capR * 1.35);
                glow.position.copy(cap.position);
                group.add(stem, cap, glow);
                maxY = Math.max(maxY, cap.position.y);
            }
            const origin = new THREE.Object3D();

        }

        function placeMushrooms(grid, floorCells, taken, paletteId, rooms) {
            const budget = mushroomBudget(paletteId);
            if (!budget) {
                return;
            }
            const blueBias = paletteId === 'iron' ? 1 : 0;
            let candidates = floorCells.filter((cell) =>
                !taken.has(`${cell.x},${cell.z}`)
                && isDirtFloor(cell.x, cell.z, rooms, paletteId)
                && cell.hash % budget.step === 2);
            if (paletteId !== 'moss') {
                const nearWall = candidates.filter((cell) =>
                    WALL_DIRS.some((dir) => isWallLike(grid[cell.z + dir.dz]?.[cell.x + dir.dx])));
                if (nearWall.length) {
                    candidates = nearWall;
                }
            }
            candidates.sort((a, b) => a.hash - b.hash);
            for (const cell of candidates.slice(0, budget.max)) {
                const walls = WALL_DIRS.filter((dir) => isWallLike(grid[cell.z + dir.dz]?.[cell.x + dir.dx]));
                const dir = walls[cell.hash % Math.max(1, walls.length)] || { dx: 0, dz: 0 };
                const ox = dir.dx * 0.3 + ((cell.hash % 5) - 2) * 0.03;
                const oz = dir.dz * 0.3 + ((cell.hash % 3) - 1) * 0.03;
                const cluster = makeMushroom(cell.hash, blueBias);
                cluster.position.set(cell.x + ox, PROP_LIFT, cell.z + oz);
                cluster.rotation.y = (cell.hash % 6) * 0.7;
                propRoot.add(cluster);
                if (mushroomLights.length < 4) {
                    mushroomLights.push(cluster.userData.light);
                } else {
                    cluster.remove(cluster.userData.light);
                }
                mushroomEmitters.push(new THREE.Vector3(
                    cluster.position.x,
                    cluster.userData.origin.position.y,
                    cluster.position.z,
                ));
                taken.add(`${cell.x},${cell.z}`);
            }
            for (let i = 0; i < MUSHROOM_SPORE_COUNT; i += 1) {
                const spore = sporeState[i];
                if (!mushroomEmitters.length || i >= mushroomEmitters.length * 6) {
                    spore.age = spore.life;
                    sporeAlphas[i] = 0;
                    continue;
                }
                spawnMushroomSpore(spore, mushroomEmitters[i % mushroomEmitters.length]);
                spore.age = spore.life * Math.random() * 0.9;
                spore.x += spore.vx * spore.age;
                spore.y += spore.vy * spore.age;
                spore.z += spore.vz * spore.age;
            }
        }

        function facingOpen(grid, x, z) {
            for (const { dx, dz } of WALL_DIRS) {
                if (isWalkable(grid[z + dz]?.[x + dx])) {
                    return Math.atan2(dx, dz);
                }
            }
            return 0;
        }

        function facingHall(grid, x, z, rooms) {
            const room = roomContaining(rooms, x, z);
            for (const { dx, dz } of WALL_DIRS) {
                const nx = x + dx;
                const nz = z + dz;
                if (!isWalkable(grid[nz]?.[nx])) {
                    continue;
                }
                if (!room || nx < room.x || nx >= room.x + room.w || nz < room.y || nz >= room.y + room.h) {
                    return Math.atan2(dx, dz);
                }
            }
            return facingOpen(grid, x, z);
        }
