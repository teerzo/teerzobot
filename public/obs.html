<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>teerzobot OBS</title>
    <style>
        html, body {
            margin: 0;
            background: transparent;
            overflow: hidden;
        }
        #log {
            color: #fff;
            font: 16px/1.3 sans-serif;
            text-shadow: 0 1px 2px #000;
            padding: 12px;
        }
    </style>
</head>
<body>
    <div id="log"></div>
    <script>
        const logEl = document.getElementById('log');
        let hideTimer;

        function show(text) {
            logEl.textContent = text;
            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
                logEl.textContent = '';
            }, 4000);
        }

        async function main() {
            const config = await fetch('/api/obs/config').then((res) => res.json());
            const scenes = config.scenes || {};
            const source = new EventSource('/api/obs/events');

            source.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const scene = scenes[data.command];
                if (scene && window.obsstudio && typeof window.obsstudio.setCurrentScene === 'function') {
                    window.obsstudio.setCurrentScene(scene);
                }
                if (data.command) {
                    show(`${data.command} (${data.displayName || data.user || 'chat'})`);
                }
            };

            source.onerror = () => {
                show('OBS events reconnecting…');
            };
        }

        main().catch((err) => {
            show(err.message || 'Failed to load OBS overlay');
        });
    </script>
</body>
</html>
