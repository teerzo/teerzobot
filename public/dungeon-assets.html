<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>teerzobot dungeon assets</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #0b0d12;
            color: #e8e4dc;
            font: 14px/1.4 "Trebuchet MS", "Segoe UI", sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        #bar {
            z-index: 10;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 10px;
            min-height: 44px;
            padding: 8px 12px;
            box-sizing: border-box;
            background: #141821;
            border-bottom: 1px solid #2a3140;
        }
        #bar strong {
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 11px;
            font-weight: 700;
            opacity: 0.62;
            margin-right: 4px;
        }
        #bar button,
        #bar select,
        #bar input {
            pointer-events: auto;
            font: inherit;
            color: #e8e4dc;
            background: #1e2533;
            border: 1px solid #3a4356;
            border-radius: 6px;
        }
        #bar button {
            padding: 4px 10px;
            cursor: pointer;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-size: 12px;
            font-weight: 700;
        }
        #bar button:hover {
            background: #2a3344;
        }
        #picker {
            min-width: 11em;
            max-width: 18em;
            padding: 4px 8px;
        }
        #search {
            width: 10em;
            padding: 4px 8px;
        }
        #search::placeholder {
            color: #8a93a4;
        }
        #count {
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            opacity: 0.85;
            white-space: nowrap;
        }
        #hint {
            margin-left: auto;
            font-size: 12px;
            opacity: 0.7;
        }
        #app {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        @media (max-width: 720px) {
            #hint { display: none; }
        }
    </style>
</head>
<body>
    <div id="bar">
        <strong>Dungeon assets</strong>
        <button type="button" id="prev" aria-label="Previous model">Prev</button>
        <select id="picker" aria-label="Choose model"></select>
        <button type="button" id="next" aria-label="Next model">Next</button>
        <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
        <button type="button" id="reset">Reset</button>
        <span id="count">1 / 1</span>
        <span id="hint">drag to orbit &middot; scroll to zoom &middot; right-drag to pan</span>
    </div>
    <div id="app"></div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { ASSETS, SHARED_GEOS, SHARED_MATS } from '/dungeon-models.js';

        const container = document.getElementById('app');
        const pickerEl = document.getElementById('picker');
        const searchEl = document.getElementById('search');
        const countEl = document.getElementById('count');
        const prevEl = document.getElementById('prev');
        const nextEl = document.getElementById('next');
        const resetEl = document.getElementById('reset');

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0d12);

        const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
        camera.position.set(0.9, 0.8, 1.4);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 0.28, 0);
        controls.minDistance = 0.3;
        controls.maxDistance = 16;

        scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a1712, 0.85));
        const keyLight = new THREE.DirectionalLight(0xfff2d8, 1.6);
        keyLight.position.set(2, 3, 2);
        scene.add(keyLight);
        const fillLight = new THREE.DirectionalLight(0x88aaff, 0.5);
        fillLight.position.set(-2, 1, -1.5);
        scene.add(fillLight);

        const grid = new THREE.GridHelper(4, 16, 0x3a4356, 0x21262f);
        scene.add(grid);

        let currentRoot = null;
        let currentIndex = 0;
        const bounds = new THREE.Box3();
        const center = new THREE.Vector3();
        const size = new THREE.Vector3();

        function matchesQuery(asset, query) {
            if (!query) {
                return true;
            }
            return asset.label.includes(query) || asset.id.includes(query);
        }

        function filteredAssets() {
            const query = searchEl.value.trim().toLowerCase();
            return ASSETS.filter((asset) => matchesQuery(asset, query));
        }

        function fillPicker() {
            const query = searchEl.value.trim().toLowerCase();
            const visible = filteredAssets();
            pickerEl.replaceChildren();
            for (const asset of visible) {
                const option = document.createElement('option');
                option.value = String(ASSETS.indexOf(asset));
                option.textContent = asset.label;
                pickerEl.appendChild(option);
            }
            if (!visible.length) {
                const empty = document.createElement('option');
                empty.value = '';
                empty.textContent = query ? 'no matches' : 'none';
                pickerEl.appendChild(empty);
                pickerEl.disabled = true;
                return;
            }
            pickerEl.disabled = false;
            const selected = visible.find((asset) => ASSETS.indexOf(asset) === currentIndex);
            pickerEl.value = String(ASSETS.indexOf(selected || visible[0]));
        }

        function disposeRoot(root) {
            if (!root) {
                return;
            }
            root.traverse((obj) => {
                if (obj.geometry && !SHARED_GEOS.has(obj.geometry)) {
                    obj.geometry.dispose();
                }
                const mats = obj.material
                    ? (Array.isArray(obj.material) ? obj.material : [obj.material])
                    : [];
                for (const mat of mats) {
                    if (mat && !SHARED_MATS.has(mat) && !mat.userData?.shared) {
                        mat.dispose();
                    }
                }
            });
        }

        function frameObject(root) {
            bounds.setFromObject(root);
            bounds.getCenter(center);
            bounds.getSize(size);
            controls.target.copy(center);
            const radius = Math.max(size.x, size.y, size.z) * 0.5 || 0.4;
            camera.position.set(
                center.x + radius * 2.2,
                center.y + radius * 1.4,
                center.z + radius * 2.8,
            );
            controls.update();
        }

        function show(index) {
            if (!ASSETS.length) {
                return;
            }
            const next = ((index % ASSETS.length) + ASSETS.length) % ASSETS.length;
            currentIndex = next;
            const asset = ASSETS[next];
            if (currentRoot) {
                scene.remove(currentRoot);
                disposeRoot(currentRoot);
                currentRoot = null;
            }
            currentRoot = asset.build();
            scene.add(currentRoot);
            frameObject(currentRoot);
            countEl.textContent = `${next + 1} / ${ASSETS.length}`;
            document.title = `${asset.label} · dungeon assets`;
            fillPicker();
        }

        function step(delta) {
            show(currentIndex + delta);
        }

        prevEl.addEventListener('click', () => step(-1));
        nextEl.addEventListener('click', () => step(1));
        pickerEl.addEventListener('change', () => {
            const index = Number(pickerEl.value);
            if (Number.isFinite(index)) {
                show(index);
            }
        });
        searchEl.addEventListener('input', () => {
            fillPicker();
        });
        searchEl.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter') {
                return;
            }
            event.preventDefault();
            const visible = filteredAssets();
            if (visible.length) {
                show(ASSETS.indexOf(visible[0]));
            }
        });
        resetEl.addEventListener('click', () => {
            searchEl.value = '';
            show(0);
        });
        window.addEventListener('keydown', (event) => {
            if (event.target === searchEl || event.target === pickerEl) {
                return;
            }
            if (event.key === 'ArrowLeft') {
                event.preventDefault();
                step(-1);
            } else if (event.key === 'ArrowRight') {
                event.preventDefault();
                step(1);
            }
        });

        function resize() {
            const width = container.clientWidth || window.innerWidth;
            const height = container.clientHeight || window.innerHeight;
            if (width < 1 || height < 1) {
                return;
            }
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height, false);
        }
        resize();
        window.addEventListener('resize', resize);
        if (typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(resize).observe(container);
        }

        show(0);

        renderer.setAnimationLoop(() => {
            controls.update();
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
