<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>teerzobot DVD</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        body.solid {
            background: #000;
        }
        .logo {
            position: absolute;
            top: 0;
            left: 0;
            width: 220px;
            height: auto;
            will-change: transform;
            color: #ff2d55;
            filter: drop-shadow(0 0 10px currentColor);
        }
        .logo.corner {
            filter: drop-shadow(0 0 22px #fff) drop-shadow(0 0 10px currentColor);
        }
        #logo-template {
            display: none !important;
        }
    </style>
</head>
<body>
    <template id="logo-template">
        <svg class="logo" viewBox="0 0 280 130" xmlns="http://www.w3.org/2000/svg" aria-label="DVD">
            <ellipse cx="140" cy="58" rx="132" ry="50" fill="none" stroke="currentColor" stroke-width="6"/>
            <text x="140" y="72" text-anchor="middle" fill="currentColor"
                font-family="Arial Black, Arial, sans-serif" font-size="54" font-weight="900" letter-spacing="2">DVD</text>
            <text x="140" y="116" text-anchor="middle" fill="currentColor"
                font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="10">VIDEO</text>
        </svg>
    </template>
    <script>
        const params = new URLSearchParams(location.search);
        const size = Math.max(80, Number(params.get('size')) || 220);
        const colors = ['#ff2d55', '#ffcc00', '#34c759', '#00c7be', '#007aff', '#bf5af2', '#ff6b00'];
        const BASE_VX = 140;
        const BASE_VY = 110;
        const template = document.getElementById('logo-template');
        const logos = [];

        if (params.has('bg')) {
            document.body.classList.add('solid');
        }

        let speed = Math.max(0.2, Number(params.get('speed')) || 1);
        let last = 0;
        let ready = false;

        function addLogo() {
            const el = template.content.firstElementChild.cloneNode(true);
            el.style.width = `${size}px`;
            document.body.appendChild(el);

            const maxX = Math.max(0, window.innerWidth - el.clientWidth);
            const maxY = Math.max(0, window.innerHeight - el.clientHeight);
            const logo = {
                el,
                x: Math.random() * maxX,
                y: Math.random() * maxY,
                vx: BASE_VX * speed * (Math.random() < 0.5 ? -1 : 1),
                vy: BASE_VY * speed * (Math.random() < 0.5 ? -1 : 1),
                colorIndex: Math.floor(Math.random() * colors.length),
            };
            el.style.color = colors[logo.colorIndex];
            el.style.transform = `translate(${logo.x}px, ${logo.y}px)`;
            logos.push(logo);
            return logo;
        }

        function removeRandomLogo() {
            if (logos.length === 0) {
                return;
            }
            const index = Math.floor(Math.random() * logos.length);
            const [logo] = logos.splice(index, 1);
            logo.el.remove();
        }

        function clearLogos() {
            for (const logo of logos) {
                logo.el.remove();
            }
            logos.length = 0;
        }

        function applySpeed(next) {
            const value = Math.max(0.2, Number(next) || 1);
            speed = value;
            for (const logo of logos) {
                const signX = logo.vx === 0 ? 1 : Math.sign(logo.vx);
                const signY = logo.vy === 0 ? 1 : Math.sign(logo.vy);
                logo.vx = BASE_VX * speed * signX;
                logo.vy = BASE_VY * speed * signY;
            }
        }

        function nextColor(logo) {
            logo.colorIndex = (logo.colorIndex + 1) % colors.length;
            logo.el.style.color = colors[logo.colorIndex];
        }

        function cornerFlash(logo) {
            logo.el.classList.add('corner');
            setTimeout(() => logo.el.classList.remove('corner'), 450);
        }

        function tick(ts) {
            if (!last) {
                last = ts;
            }
            const dt = Math.min(0.05, (ts - last) / 1000);
            last = ts;

            for (const logo of logos) {
                const maxX = Math.max(0, window.innerWidth - logo.el.clientWidth);
                const maxY = Math.max(0, window.innerHeight - logo.el.clientHeight);
                logo.x += logo.vx * dt;
                logo.y += logo.vy * dt;

                let hitX = false;
                let hitY = false;
                if (logo.x <= 0) {
                    logo.x = 0;
                    logo.vx = Math.abs(logo.vx);
                    hitX = true;
                } else if (logo.x >= maxX) {
                    logo.x = maxX;
                    logo.vx = -Math.abs(logo.vx);
                    hitX = true;
                }
                if (logo.y <= 0) {
                    logo.y = 0;
                    logo.vy = Math.abs(logo.vy);
                    hitY = true;
                } else if (logo.y >= maxY) {
                    logo.y = maxY;
                    logo.vy = -Math.abs(logo.vy);
                    hitY = true;
                }

                if (hitX || hitY) {
                    nextColor(logo);
                    if (hitX && hitY) {
                        cornerFlash(logo);
                    }
                }

                logo.el.style.transform = `translate(${logo.x}px, ${logo.y}px)`;
            }

            requestAnimationFrame(tick);
        }

        function onResize() {
            for (const logo of logos) {
                const maxX = Math.max(0, window.innerWidth - logo.el.clientWidth);
                const maxY = Math.max(0, window.innerHeight - logo.el.clientHeight);
                logo.x = Math.min(Math.max(0, logo.x), maxX);
                logo.y = Math.min(Math.max(0, logo.y), maxY);
            }
        }

        function start() {
            if (ready) {
                return;
            }
            ready = true;
            addLogo();
            requestAnimationFrame(tick);

            fetch('/api/dvd')
                .then((res) => res.json())
                .then((data) => {
                    if (data.speed != null) {
                        applySpeed(data.speed);
                    }
                })
                .catch(() => {});

            const source = new EventSource('/api/dvd/events');
            source.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.action === 'add') {
                    addLogo();
                    return;
                }
                if (data.action === 'remove-random') {
                    removeRandomLogo();
                    return;
                }
                if (data.action === 'clear') {
                    clearLogos();
                    return;
                }
                if (data.speed != null) {
                    applySpeed(data.speed);
                }
            };
        }

        window.addEventListener('resize', onResize);
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(start);
        }
        window.addEventListener('load', start);
    </script>
</body>
</html>
