        function furnitureGroups(grid, width, height) {
            const seen = new Set();
            const groups = [];
            for (let z = 0; z < height; z++) {
                for (let x = 0; x < width; x++) {
                    if (grid[z][x] !== FURNITURE || seen.has(`${x},${z}`)) {
                        continue;
                    }
                    const cells = [];
                    const queue = [[x, z]];
                    seen.add(`${x},${z}`);
                    for (let i = 0; i < queue.length; i++) {
                        const [cx, cz] = queue[i];
                        cells.push({ x: cx, z: cz });
                        for (const dir of WALL_DIRS) {
                            const nx = cx + dir.dx;
                            const nz = cz + dir.dz;
                            const key = `${nx},${nz}`;
                            if (grid[nz]?.[nx] !== FURNITURE || seen.has(key)) {
                                continue;
                            }
                            seen.add(key);
                            queue.push([nx, nz]);
                        }
                    }
                    let minx = cells[0].x;
                    let maxx = cells[0].x;
                    let minz = cells[0].z;
                    let maxz = cells[0].z;
                    for (const cell of cells) {
                        minx = Math.min(minx, cell.x);
                        maxx = Math.max(maxx, cell.x);
                        minz = Math.min(minz, cell.z);
                        maxz = Math.max(maxz, cell.z);
                    }
                    groups.push({
                        cells,
                        minx,
                        maxx,
                        minz,
                        maxz,
                        hash: Math.abs(minx * 31 + minz * 47 + cells.length * 13),
                    });
                }
            }
            return groups;
        }

        function facingFromWalls(grid, cells) {
            for (const cell of cells) {
                for (const dir of WALL_DIRS) {
                    if (isWallLike(grid[cell.z + dir.dz]?.[cell.x + dir.dx])) {
                        return Math.atan2(-dir.dx, -dir.dz);
                    }
                }
            }
            return 0;
        }

        function placeLargeFurniture(grid, width, height, rooms) {
            for (const group of furnitureGroups(grid, width, height)) {
                const n = group.cells.length;
                const cx = (group.minx + group.maxx) / 2;
                const cz = (group.minz + group.maxz) / 2;
                const alongX = group.maxx - group.minx >= group.maxz - group.minz;
                const room = roomContaining(rooms, Math.round(cx), Math.round(cz));
                const kind = room?.kind;
                let prop;
                if (kind === 'bedroom') {
                    prop = n >= 2 ? makeBed() : makeCabinet();
                } else if (kind === 'kitchen') {
                    prop = makeTable(n >= 2 ? 1.55 : 0.72, 0.7);
                    if (n >= 2) {
                        const c1 = makeChair();
                        c1.position.set(0, 0, -0.48);
                        const c2 = makeChair();
                        c2.position.set(0, 0, 0.48);
                        c2.rotation.y = Math.PI;
                        prop.add(c1, c2);
                    }
                } else if (kind === 'study' || kind === 'library') {
                    prop = n >= 2 ? makeBookshelf() : makeCabinet();
                } else if (kind === 'dining' || kind === 'barracks') {
                    prop = n >= 4 ? makeDiningTable() : makeTable(1.55, 0.7);
                } else if (kind === 'chapel' || kind === 'shrine') {
                    prop = n >= 2 ? makeAltar() : makePew();
                } else if (kind === 'forge') {
                    prop = makeAnvil();
                } else if (kind === 'armory') {
                    prop = makeWeaponRack();
                } else if (kind === 'crypt') {
                    prop = makeSarcophagus();
                } else if (kind === 'garden') {
                    prop = makePlanter();
                } else if (kind === 'well') {
                    prop = makeWell();
                } else if (kind === 'cave') {
                    prop = n >= 2 ? makeBoulder(group.hash) : makeStalagmite(group.hash);
                    if (n >= 2) {
                        const extra = makeStalagmite(group.hash + 3);
                        extra.position.set(0.26, 0, 0.1);
                        extra.scale.set(0.72, 0.72, 0.72);
                        prop.add(extra);
                    }
                } else if (kind === 'cell' || kind === 'pantry' || kind === 'closet') {
                    if (kind === 'closet') {
                        prop = makeCabinet();
                    } else {
                        prop = makeCrate();
                        prop.scale.set(1.7, 1.7, 1.7);
                    }
                } else if (n >= 4) {
                    prop = group.hash % 3 === 0 ? makeBed() : makeDiningTable();
                } else if (n >= 2) {
                    if (group.hash % 2 === 0) {
                        prop = makeTable(1.55, 0.7);
                        const c1 = makeChair();
                        c1.position.set(0, 0, -0.48);
                        const c2 = makeChair();
                        c2.position.set(0, 0, 0.48);
                        c2.rotation.y = Math.PI;
                        prop.add(c1, c2);
                    } else {
                        prop = makeBookshelf();
                    }
                } else if (group.hash % 3 === 0) {
                    prop = makeCabinet();
                } else if (group.hash % 3 === 1) {
                    prop = makeTable();
                } else {
                    prop = makeCrate();
                    prop.scale.set(1.7, 1.7, 1.7);
                }
                prop.position.set(cx, PROP_LIFT, cz);
                if (kind === 'study' || kind === 'library' || kind === 'closet' || n === 1) {
                    prop.rotation.y = facingFromWalls(grid, group.cells);
                } else {
                    prop.rotation.y = alongX ? 0 : Math.PI / 2;
                }
                propRoot.add(prop);
            }
        }

        const WALL_PROP_MAKERS = [makeHole, makeWeapons, makeBanner];
        const FLOOR_PROP_MAKERS = [makePlant, makeBarrel, makeCrate, makeChair];
        const DETAIL_PROP_MAKERS = [makePit, makeRug];

        function placeTorches(grid, width, height) {
            clearTorches();
            const faces = collectFaces(grid, width, height);
            const spots = faces.filter((face) => face.hash % 5 === 0).sort((a, b) => a.hash - b.hash).slice(0, 8);
            const used = new Set();
            torchRoot = new THREE.Group();
            for (const spot of spots) {
                used.add(faceKey(spot.wx, spot.wz, spot.dx, spot.dz));
                const px = spot.wx - spot.dx * WALL_PUSH;
                const pz = spot.wz - spot.dz * WALL_PUSH;
                const py = 0.5;
                const torch = makeTorch();
                torch.position.set(px, py, pz);
                torch.rotation.y = Math.atan2(-spot.dx, -spot.dz);
                torchRoot.add(torch);
                torchMeshes.push(torch);

                const light = new THREE.PointLight(0xff8a3a, 2.1, 5.2, 1.7);
                light.position.set(px - spot.dx * 0.08, py + 0.18, pz - spot.dz * 0.08);
                light.userData.base = 1.9 + (spot.hash % 5) * 0.08;
                scene.add(light);
                torchLights.push(light);
            }
            scene.add(torchRoot);
            if (!torchMeshes.length) {
                return used;
            }
            torchRoot.updateMatrixWorld(true);
            for (const torch of torchMeshes) {
                const origin = new THREE.Vector3();
                torch.userData.origin.getWorldPosition(origin);
                torchEmitters.push(origin);
            }
            for (let i = 0; i < TORCH_EMBER_COUNT; i += 1) {
                const ember = emberState[i];
                if (i >= torchEmitters.length * 8) {
                    ember.age = ember.life;
                    emberAlphas[i] = 0;
                    continue;
                }
                spawnTorchEmber(ember, torchEmitters[i % torchEmitters.length]);
                ember.age = ember.life * Math.random() * 0.9;
                ember.x += ember.vx * ember.age;
                ember.y += ember.vy * ember.age;
                ember.z += ember.vz * ember.age;
            }
            return used;
        }

        function placeCarpets(rooms, paletteId, grid) {
            for (const room of rooms || []) {
                const hash = Math.abs(room.x * 13 + room.y * 17);
                const yes = CARPET_ROOMS.has(room.kind)
                    || (CARPET_SOMETIMES.has(room.kind) && hash % 2 === 0);
                if (!yes) {
                    continue;
                }
                let hazard = false;
                for (let y = room.y; y < room.y + room.h && !hazard; y++) {
                    for (let x = room.x; x < room.x + room.w; x++) {
                        const cell = grid?.[y]?.[x];
                        if (cell === WATER_TILE || cell === SPIKE_TILE) {
                            hazard = true;
                            break;
                        }
                    }
                }
                if (hazard) {
                    continue;
                }
                const carpet = makeCarpet(room, hash, paletteId);
                carpet.position.set(room.x + (room.w - 1) / 2, PROP_LIFT, room.y + (room.h - 1) / 2);
                propRoot.add(carpet);
            }
        }

        function placeSplatters(grid, width, height, rooms, paletteId, floor, faces) {
            if (floor <= 0 || paletteId === 'gilt') {
                return;
            }
            const bloodish = paletteId === 'blood' || paletteId === 'crypt';
            const slimeish = paletteId === 'sewer' || paletteId === 'moss';
            let n = 0;
            for (const face of faces) {
                if (grid[face.z]?.[face.x] === DOOR_TILE || grid[face.wz]?.[face.wx] === WINDOW_WALL) {
                    continue;
                }
                const room = roomContaining(rooms, face.x, face.z);
                if (CLEAN_ROOMS.has(room?.kind)) {
                    continue;
                }
                const wantBlood = bloodish || BLOOD_ROOMS.has(room?.kind);
                const wantSlime = slimeish || SLIME_ROOMS.has(room?.kind);
                if (!wantBlood && !wantSlime) {
                    continue;
                }
                if (face.propHash % 6 !== 0) {
                    continue;
                }
                const mat = wantBlood && (!wantSlime || face.propHash % 2 === 0)
                    ? bloodSplatterMat
                    : slimeSplatterMat;
                const decal = new THREE.Mesh(new THREE.PlaneGeometry(0.38, 0.48), mat);
                decal.position.set(face.wx - face.dx * WALL_DECAL, 0.55, face.wz - face.dz * WALL_DECAL);
                decal.rotation.y = Math.atan2(-face.dx, -face.dz);
                propRoot.add(decal);
                n += 1;
                if (n > 18) {
                    break;
                }
            }
            for (let z = 0; z < height && n < 28; z++) {
                for (let x = 0; x < width && n < 28; x++) {
                    if (grid[z][x] !== 0) {
                        continue;
                    }
                    const room = roomContaining(rooms, x, z);
                    if (CLEAN_ROOMS.has(room?.kind)) {
                        continue;
                    }
                    const wantBlood = bloodish || BLOOD_ROOMS.has(room?.kind);
                    const wantSlime = slimeish || SLIME_ROOMS.has(room?.kind);
                    if (!wantBlood && !wantSlime) {
                        continue;
                    }
                    const hash = Math.abs(x * 19 + z * 23);
                    if (hash % 8 !== 0) {
                        continue;
                    }
                    const mat = wantBlood && hash % 2 === 0 ? bloodSplatterMat : slimeSplatterMat;
                    const decal = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.32), mat);
                    decal.rotation.x = -Math.PI / 2;
                    decal.position.set(x, 0.055, z);
                    propRoot.add(decal);
                    n += 1;
                }
            }
        }

        function hallWalkAxis(grid, x, z) {
            const n = isWallLike(grid[z - 1]?.[x]);
            const s = isWallLike(grid[z + 1]?.[x]);
            const e = isWallLike(grid[z]?.[x + 1]);
            const w = isWallLike(grid[z]?.[x - 1]);
            const ns = n && s;
            const ew = e && w;
            if (ns && !ew) {
                return 'x';
            }
            if (ew && !ns) {
                return 'z';
            }
            return null;
        }

        function pickHangKind(hash, paletteId) {
            const mossy = paletteId === 'moss' || paletteId === 'sewer' || paletteId === 'cave';
            const dusty = paletteId === 'crypt' || paletteId === 'blood' || paletteId === 'iron';
            const roll = hash % 6;
            if (paletteId === 'gilt') {
                return 'cobweb';
            }
            if (dusty) {
                return roll < 4 ? 'cobweb' : roll === 4 ? 'vine' : 'plant';
            }
            if (mossy) {
                return roll < 2 ? 'cobweb' : roll < 4 ? 'vine' : 'plant';
            }
            return roll < 2 ? 'cobweb' : roll < 4 ? 'vine' : 'plant';
        }

        function placeHallHangings(grid, width, height, rooms, player, exit, blocked, paletteId, floor) {
            const hung = new Set();
            const cap = floor <= 0 ? 2 : Math.min(18, 6 + Math.floor((width * height) / 36));
            const step = paletteId === 'gilt' ? 5 : 3;
            let n = 0;
            const spots = [];
            for (let z = 1; z < height - 1; z++) {
                for (let x = 1; x < width - 1; x++) {
                    if (grid[z][x] !== 0) {
                        continue;
                    }
                    if (isReservedCell(x, z, player, exit) || blocked.has(`${x},${z}`)) {
                        continue;
                    }
                    if (roomContaining(rooms, x, z)) {
                        continue;
                    }
                    const axis = hallWalkAxis(grid, x, z);
                    if (!axis) {
                        continue;
                    }
                    if (grid[z]?.[x - 1] === DOOR_TILE || grid[z]?.[x + 1] === DOOR_TILE
                        || grid[z - 1]?.[x] === DOOR_TILE || grid[z + 1]?.[x] === DOOR_TILE) {
                        continue;
                    }
                    const hash = Math.abs(x * 41 + z * 73 + (floor || 0) * 17);
                    if (hash % step !== 0) {
                        continue;
                    }
                    spots.push({ x, z, axis, hash });
                }
            }
            spots.sort((a, b) => a.hash - b.hash);
            for (const spot of spots) {
                if (n >= cap) {
                    break;
                }
                const near = [`${spot.x},${spot.z}`, `${spot.x + 1},${spot.z}`, `${spot.x - 1},${spot.z}`, `${spot.x},${spot.z + 1}`, `${spot.x},${spot.z - 1}`];
                if (near.some((key) => hung.has(key))) {
                    continue;
                }
                const kind = pickHangKind(spot.hash, paletteId);
                const cobweb = kind === 'cobweb';
                const mesh = new THREE.Mesh(
                    cobweb ? cobwebHangGeo : hangCurtainGeo,
                    cobweb ? cobwebHangMat : kind === 'vine' ? vineHangMat : plantHangMat,
                );
                mesh.rotation.y = spot.axis === 'x' ? Math.PI / 2 : 0;
                const along = ((spot.hash % 5) - 2) * 0.06;
                const side = spot.hash % 3 === 0 ? 0 : ((spot.hash % 2) * 2 - 1) * 0.18;
                const y = cobweb ? WALL_H - 0.44 : WALL_H * 0.48;
                if (spot.axis === 'x') {
                    mesh.position.set(spot.x + along, y, spot.z + (cobweb ? 0 : side));
                } else {
                    mesh.position.set(spot.x + (cobweb ? 0 : side), y, spot.z + along);
                }
                propRoot.add(mesh);
                hung.add(`${spot.x},${spot.z}`);
                n += 1;
            }
        }

        function placeProps(grid, width, height, player, exit, torchFaces, rooms, paletteId, floor) {
            clearProps();
            propRoot = new THREE.Group();
            const faces = collectFaces(grid, width, height);
            const openFaces = faces
                .filter((face) => !torchFaces.has(faceKey(face.wx, face.wz, face.dx, face.dz)))
                .filter((face) => !isReservedCell(face.x, face.z, player, exit));

            const paintingSpots = openFaces
                .filter((face) => face.propHash % 2 === 0)
                .filter((face) => roomContaining(rooms, face.x, face.z)?.kind !== 'cave')
                .sort((a, b) => a.propHash - b.propHash)
                .slice(0, 12);
            const paintingFaces = new Set(paintingSpots.map((face) => faceKey(face.wx, face.wz, face.dx, face.dz)));

            const usedCells = new Set();
            for (const spot of paintingSpots) {
                const prop = makePainting(spot.propHash);
                const px = spot.wx - spot.dx * WALL_PUSH;
                const pz = spot.wz - spot.dz * WALL_PUSH;
                prop.position.set(px, EYE, pz);
                prop.rotation.y = Math.atan2(-spot.dx, -spot.dz);
                propRoot.add(prop);
                usedCells.add(`${spot.x},${spot.z}`);
            }

            const wallSpots = openFaces
                .filter((face) => !paintingFaces.has(faceKey(face.wx, face.wz, face.dx, face.dz)))
                .filter((face) => face.propHash % 5 === 0)
                .sort((a, b) => a.propHash - b.propHash)
                .slice(0, 10);
            for (const spot of wallSpots) {
                const room = roomContaining(rooms, spot.x, spot.z);
                if (room?.kind === 'cave') {
                    continue;
                }
                let maker = WALL_PROP_MAKERS[spot.propHash % WALL_PROP_MAKERS.length];
                if (room?.kind === 'armory' || room?.kind === 'barracks') {
                    maker = makeWeapons;
                } else if (room?.kind === 'chapel' || room?.kind === 'shrine') {
                    maker = makeBanner;
                }
                const prop = maker(spot.propHash);
                const px = spot.wx - spot.dx * WALL_PUSH;
                const pz = spot.wz - spot.dz * WALL_PUSH;
                const heights = [0.72, 0.92, 0.78, 0.95];
                prop.position.set(px, heights[spot.propHash % heights.length], pz);
                prop.rotation.y = Math.atan2(-spot.dx, -spot.dz);
                propRoot.add(prop);
                usedCells.add(`${spot.x},${spot.z}`);
            }

            const floorCells = [];
            for (let z = 0; z < height; z++) {
                for (let x = 0; x < width; x++) {
                    const cell = grid[z][x];
                    if (cell !== 0 && cell !== 2) {
                        continue;
                    }
                    if (isReservedCell(x, z, player, exit) || usedCells.has(`${x},${z}`)) {
                        continue;
                    }
                    const hash = Math.abs(x * 37 + z * 53);
                    floorCells.push({ x, z, hash });
                }
            }
            floorCells.sort((a, b) => a.hash - b.hash);

            const furniture = floorCells.filter((cell) => cell.hash % 7 === 0).slice(0, 12);
            const furnitureCells = new Set(furniture.map((cell) => `${cell.x},${cell.z}`));
            for (const cell of furniture) {
                const walls = WALL_DIRS.filter((dir) => isWallLike(grid[cell.z + dir.dz]?.[cell.x + dir.dx]));
                const dir = walls[cell.hash % Math.max(1, walls.length)] || { dx: 0, dz: 1 };
                const room = roomContaining(rooms, cell.x, cell.z);
                let maker = FLOOR_PROP_MAKERS[cell.hash % FLOOR_PROP_MAKERS.length];
                if (room?.kind === 'garden') {
                    maker = makePlant;
                } else if (room?.kind === 'kitchen') {
                    maker = makeBarrel;
                } else if (room?.kind === 'cave') {
                    maker = cell.hash % 2 === 0 ? makeStalagmite : makeBoulder;
                }
                const prop = maker(cell.hash);
                prop.position.set(cell.x + dir.dx * 0.32, PROP_LIFT, cell.z + dir.dz * 0.32);
                prop.rotation.y = Math.atan2(-dir.dx, -dir.dz);
                propRoot.add(prop);
            }

            const details = floorCells
                .filter((cell) => !furnitureCells.has(`${cell.x},${cell.z}`) && cell.hash % 11 === 0)
                .slice(0, 8);
            const detailCells = new Set(details.map((cell) => `${cell.x},${cell.z}`));
            for (const cell of details) {
                const room = roomContaining(rooms, cell.x, cell.z);
                const maker = DETAIL_PROP_MAKERS[cell.hash % DETAIL_PROP_MAKERS.length];
                if (maker === makePit && ['cell', 'crypt', 'armory', 'barracks'].includes(room?.kind)) {
                    continue;
                }
                if (room?.kind === 'cave' && maker === makeRug) {
                    continue;
                }
                const prop = room?.kind === 'cave' ? makeBoulder(cell.hash) : maker(cell.hash);
                const ox = ((cell.hash % 5) - 2) * 0.06;
                const oz = ((cell.hash % 3) - 1) * 0.06;
                prop.position.set(cell.x + ox, PROP_LIFT, cell.z + oz);
                prop.rotation.y = (cell.hash % 4) * (Math.PI / 2);
                propRoot.add(prop);
            }

            const taken = new Set([...furnitureCells, ...detailCells]);
            placeCarpets(rooms, paletteId, grid);
            placeSplatters(grid, width, height, rooms, paletteId, floor, openFaces);
            placeMushrooms(grid, floorCells, taken, paletteId, rooms);

            placeLargeFurniture(grid, width, height, rooms);
            placeHallHangings(grid, width, height, rooms, player, exit, new Set([...usedCells, ...taken]), paletteId, floor);
            scene.add(propRoot);
        }

        function rebuildMaze(state) {
            clearFx();
            disposeMesh(floorBase);
            for (const mesh of floorMeshes) {
                disposeMesh(mesh);
            }
            floorMeshes = [];
            disposeMesh(ceilMesh);
            for (const mesh of ceilMeshes) {
                disposeMesh(mesh);
            }
            ceilMeshes = [];
            disposeMesh(wallMesh);
            disposeMesh(vineWallMesh);
            disposeMesh(crackedWallMesh);
            disposeMesh(halfWallMesh);
            disposeMesh(brokenWallMesh);
            disposeMesh(woodWallMesh);
            disposeMesh(metalWallMesh);
            clearExtraWalls();
            clearHazards();
            clearEnemies();
            clearStains();
            clearTorches();
            clearProps();

            const palette = applyPalette(state.palette);
            waterMat.color.setHex(state.palette === 'sewer' ? 0x2a4a18 : 0x1a4858);
            waterMat.emissive.setHex(state.palette === 'sewer' ? 0x14280c : 0x0a2838);
            for (const mat of floorMats) {
                mat.color.setHex(palette.floor);
            }

            const w = state.width;
            const h = state.height;
            const floorGeo = new THREE.PlaneGeometry(w * CELL, h * CELL);
            floorGeo.rotateX(-Math.PI / 2);
            floorBase = new THREE.Mesh(floorGeo, floorBaseMat);
            floorBase.position.set((w - 1) / 2, -0.55, (h - 1) / 2);
            floorBase.receiveShadow = true;
            scene.add(floorBase);

            const ceilGeo = new THREE.PlaneGeometry(w * CELL, h * CELL);
            ceilGeo.rotateX(Math.PI / 2);
            ceilMesh = new THREE.Mesh(ceilGeo, ceilMat);
            ceilMesh.position.set((w - 1) / 2, WALL_H, (h - 1) / 2);
            scene.add(ceilMesh);

            const stoneWalls = [];
            const vineWalls = [];
            const crackedWalls = [];
            const woodWalls = [];
            const metalWalls = [];
            const halfWalls = [];
            const brokenWalls = [];
            const holeWalls = [];
            const fenceWalls = [];
            const windowWalls = [];
            const breachWalls = [];
            const waterTiles = [];
            const spikeTiles = [];
            const doorTiles = [];
            const paletteId = state.palette || 'stone';
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const cell = state.grid[y][x];
                    if (cell === FULL_WALL) {
                        const room = roomBeside(state.rooms, x, y);
                        const roll = (x * 7 + y * 13) % 5;
                        const wallKind = pickWallKind(room, paletteId, roll);
                        if (wallKind === 'wood') {
                            woodWalls.push(x, y);
                        } else if (wallKind === 'metal') {
                            metalWalls.push(x, y);
                        } else if (wallKind === 'vine') {
                            vineWalls.push(x, y);
                        } else if (wallKind === 'cracked') {
                            crackedWalls.push(x, y);
                        } else {
                            stoneWalls.push(x, y);
                        }
                    } else if (cell === HALF_WALL) {
                        halfWalls.push(x, y);
                    } else if (cell === BROKEN_WALL) {
                        brokenWalls.push(x, y);
                    } else if (cell === HOLE_WALL) {
                        holeWalls.push(x, y);
                    } else if (cell === FENCE_WALL) {
                        fenceWalls.push(x, y);
                    } else if (cell === WINDOW_WALL) {
                        windowWalls.push(x, y);
                    } else if (cell === BREACH_WALL) {
                        breachWalls.push(x, y);
                    } else if (cell === WATER_TILE) {
                        waterTiles.push(x, y);
                    } else if (cell === SPIKE_TILE) {
                        spikeTiles.push(x, y);
                    } else if (cell === DOOR_TILE) {
                        doorTiles.push(x, y);
                    }
                }
            }

            function buildWalls(positions, material, height, widthX = 1.02, widthZ = 1.02) {
                const count = positions.length / 2 || 1;
                const mesh = new THREE.InstancedMesh(makeWallBoxGeo(widthX, height, widthZ), material, count);
                mesh.castShadow = false;
                mesh.receiveShadow = false;
                const dummy = new THREE.Object3D();
                const color = new THREE.Color();
                for (let i = 0; i < positions.length; i += 2) {
                    const index = i / 2;
                    dummy.position.set(positions[i], height / 2, positions[i + 1]);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(index, dummy.matrix);
                    const shade = 0.88 + ((positions[i] * 13 + positions[i + 1] * 7) % 9) * 0.015;
                    const room = roomBeside(state.rooms, positions[i], positions[i + 1]);
                    accentColor(color, room, shade);
                    mesh.setColorAt(index, color);
                }
                mesh.instanceMatrix.needsUpdate = true;
                if (mesh.instanceColor) {
                    mesh.instanceColor.needsUpdate = true;
                }
                scene.add(mesh);
                return mesh;
            }

            wallMesh = stoneWalls.length ? buildWalls(stoneWalls, wallMat, WALL_H) : null;
            vineWallMesh = vineWalls.length ? buildWalls(vineWalls, vineWallMat, WALL_H) : null;
            crackedWallMesh = crackedWalls.length ? buildWalls(crackedWalls, crackedWallMat, WALL_H) : null;
            woodWallMesh = woodWalls.length ? buildWalls(woodWalls, woodWallMat, WALL_H) : null;
            metalWallMesh = metalWalls.length ? buildWalls(metalWalls, metalWallMat, WALL_H) : null;
            halfWallMesh = halfWalls.length ? buildWalls(halfWalls, wallMat, HALF_H) : null;
            brokenWallMesh = brokenWalls.length ? buildWalls(brokenWalls, crackedWallMat, BROKEN_H, 0.94, 0.88) : null;

            extraWallRoot = new THREE.Group();
            for (let i = 0; i < holeWalls.length; i += 2) {
                const hole = makeHoleWall();
                hole.position.set(holeWalls[i], 0, holeWalls[i + 1]);
                extraWallRoot.add(hole);
            }
            for (let i = 0; i < fenceWalls.length; i += 2) {
                const fence = makeFenceWall();
                fence.position.set(fenceWalls[i], 0, fenceWalls[i + 1]);
                fence.rotation.y = facingOpen(state.grid, fenceWalls[i], fenceWalls[i + 1]);
                extraWallRoot.add(fence);
            }
            for (let i = 0; i < windowWalls.length; i += 2) {
                const wx = windowWalls[i];
                const wz = windowWalls[i + 1];
                const room = roomBeside(state.rooms, wx, wz);
                const stained = STAINED_WINDOW_ROOMS.has(room?.kind)
                    || (!NIGHT_WINDOW_ROOMS.has(room?.kind) && ((wx * 7 + wz * 13) & 1) === 0);
                const win = makeWindowWall(stained, wx + wz * 3);
                win.position.set(wx, 0, wz);
                win.rotation.y = facingOpen(state.grid, wx, wz);
                extraWallRoot.add(win);
                if (win.userData.light && windowLights.length < 3) {
                    windowLights.push(win.userData.light);
                } else if (win.userData.light) {
                    win.remove(win.userData.light);
                    win.userData.light = null;
                }
            }
            for (let i = 0; i < breachWalls.length; i += 2) {
                const breach = makeBreachWall();
                breach.position.set(breachWalls[i], 0, breachWalls[i + 1]);
                extraWallRoot.add(breach);
            }
            for (let i = 0; i < doorTiles.length; i += 2) {
                const dx = doorTiles[i];
                const dz = doorTiles[i + 1];
                const room = roomContaining(state.rooms, dx, dz) || roomBeside(state.rooms, dx, dz);
                const door = makeDoorway(room?.kind);
                const yaw = facingHall(state.grid, dx, dz, state.rooms);
                door.rotation.y = yaw;
                door.position.set(dx + Math.sin(yaw) * 0.5, 0, dz + Math.cos(yaw) * 0.5);
                extraWallRoot.add(door);
                if (door.userData.hinge) {
                    doorHinges.push({
                        hinge: door.userData.hinge,
                        x: dx,
                        z: dz,
                    });
                }
            }
            scene.add(extraWallRoot);

            hazardRoot = new THREE.Group();
            for (let i = 0; i < waterTiles.length; i += 2) {
                const tile = makeWaterTile();
                tile.position.set(waterTiles[i], 0, waterTiles[i + 1]);
                hazardRoot.add(tile);
                if (tile.userData.water) {
                    waterMeshes.push(tile.userData.water);
                }
            }
            for (let i = 0; i < spikeTiles.length; i += 2) {
                const tile = makeSpikeTile();
                tile.position.set(spikeTiles[i], 0, spikeTiles[i + 1]);
                hazardRoot.add(tile);
            }
            scene.add(hazardRoot);

            const floorMap = Array.from({ length: h }, () => Array(w).fill(null));
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (!isFloorTile(state.grid[y][x])) {
                        continue;
                    }
                    floorMap[y][x] = pickFloorKind(x, y, state.rooms, paletteId);
                }
            }
            const floorBuckets = FLOOR_KINDS.map(() => []);
            const seamDirs = [
                { dx: 0, dy: -1, bit: 1 },
                { dx: 1, dy: 0, bit: 2 },
                { dx: 0, dy: 1, bit: 4 },
                { dx: -1, dy: 0, bit: 8 },
            ];
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const base = floorMap[y][x];
                    if (!base) {
                        continue;
                    }
                    const me = floorFamily(base);
                    let bits = 0;
                    const others = new Set();
                    for (const { dx, dy, bit } of seamDirs) {
                        const nKind = floorMap[y + dy]?.[x + dx];
                        if (!nKind) {
                            continue;
                        }
                        const fam = floorFamily(nKind);
                        if (fam === me) {
                            continue;
                        }
                        bits |= bit;
                        others.add(fam);
                    }
                    const resolved = resolveFloorSeam(base, bits, seamOther(me, others), x, y);
                    let kind = FLOOR_KINDS.indexOf(resolved.kind);
                    if (kind < 0) {
                        kind = FLOOR_KINDS.indexOf(base);
                    }
                    if (kind < 0) {
                        kind = 0;
                    }
                    floorBuckets[kind].push(x, y, resolved.rot);
                }
            }

            const tileGeo = new THREE.PlaneGeometry(1, 1);
            tileGeo.rotateX(-Math.PI / 2);
            const dummy = new THREE.Object3D();
            const color = new THREE.Color();
            for (let k = 0; k < floorBuckets.length; k++) {
                const positions = floorBuckets[k];
                if (!positions.length) {
                    continue;
                }
                const mesh = new THREE.InstancedMesh(tileGeo.clone(), floorMats[k], positions.length / 3);
                mesh.receiveShadow = true;
                for (let i = 0; i < positions.length; i += 3) {
                    const index = i / 3;
                    dummy.position.set(positions[i], 0.002, positions[i + 1]);
                    dummy.rotation.y = positions[i + 2] * (Math.PI / 2);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(index, dummy.matrix);
                    const shade = 0.9 + ((positions[i] * 5 + positions[i + 1] * 11) % 6) * 0.02;
                    const room = roomContaining(state.rooms, positions[i], positions[i + 1]);
                    accentColor(color, room, shade);
                    mesh.setColorAt(index, color);
                }
                mesh.instanceMatrix.needsUpdate = true;
                if (mesh.instanceColor) {
                    mesh.instanceColor.needsUpdate = true;
                }
                scene.add(mesh);
                floorMeshes.push(mesh);
            }
            tileGeo.dispose();

            const ceilBuckets = CEIL_KINDS.map(() => []);
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (!isCeilTile(state.grid[y][x])) {
                        continue;
                    }
                    const kindName = pickCeilKind(x, y, state.rooms);
                    const kind = Math.max(0, CEIL_KINDS.indexOf(kindName));
                    ceilBuckets[kind].push(x, y);
                }
            }
            const ceilTileGeo = new THREE.PlaneGeometry(1, 1);
            ceilTileGeo.rotateX(Math.PI / 2);
            for (let k = 0; k < ceilBuckets.length; k++) {
                const positions = ceilBuckets[k];
                if (!positions.length) {
                    continue;
                }
                const mesh = new THREE.InstancedMesh(ceilTileGeo.clone(), ceilMats[k], positions.length / 2);
                for (let i = 0; i < positions.length; i += 2) {
                    const index = i / 2;
                    dummy.position.set(positions[i], WALL_H - 0.002, positions[i + 1]);
                    dummy.rotation.y = ((positions[i] + positions[i + 1]) % 4) * (Math.PI / 2);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(index, dummy.matrix);
                    const shade = 0.82 + ((positions[i] * 5 + positions[i + 1] * 11) % 6) * 0.02;
                    const room = roomContaining(state.rooms, positions[i], positions[i + 1]);
                    accentColor(color, room, shade);
                    mesh.setColorAt(index, color);
                }
                mesh.instanceMatrix.needsUpdate = true;
                if (mesh.instanceColor) {
                    mesh.instanceColor.needsUpdate = true;
                }
                scene.add(mesh);
                ceilMeshes.push(mesh);
            }
            ceilTileGeo.dispose();

            const torchFaces = placeTorches(state.grid, w, h);
            for (const light of torchLights) {
                light.color.setHex(palette.torch);
            }
            placeProps(state.grid, w, h, state.player, state.exit, torchFaces, state.rooms, state.palette, state.floor);
        }

        function applyState(state, snap) {
            if (!state) {
                return;
            }
            if (Array.isArray(state.artwork)) {
                artworkUrls = state.artwork.map((url) => String(url || '').trim()).filter(Boolean);
            }
            applyCanvasSize(state.canvasWidth, state.canvasHeight, state.anchor);
            const showing = state.visible !== false;
            const resume = showing && document.documentElement.classList.contains('paused');
            const worldId = Number(state.worldId) || 0;
            const worldChanged = shownWorldId !== null && worldId !== shownWorldId;
            const died = Boolean(state.lastAction?.died);
            if (died && !snap && shownWorldId !== null && worldChanged) {
                if (transitioning) {
                    pendingState = state;
                    return;
                }
                startLevelTransition(state, true);
                return;
            }
            if (worldChanged && !died) {
                transitioning = false;
                pendingState = null;
                transitionEl.classList.remove('out', 'title');
                snap = true;
            }
            setOverlayVisible(showing);
            if (!showing) {
                return;
            }
            if (!state.grid?.length) {
                return;
            }
            if (transitioning) {
                pendingState = state;
                return;
            }
            const nextFloor = Number(state.floor);
            const isNewFloor = shownFloor !== null && nextFloor !== shownFloor;
            if (isNewFloor && !snap && !resume) {
                startLevelTransition(state);
                return;
            }
            commitWorld(state, snap || resume || shownFloor === null);
            shownFloor = nextFloor;
            shownWorldId = worldId;
        }

        function applyCanvasSize(width, height, corner) {
            const w = Number(width) > 0 ? Math.round(Number(width)) : 640;
            const h = Number(height) > 0 ? Math.round(Number(height)) : 480;
            canvasW = w;
            canvasH = h;
            stageEl.style.width = `${w}px`;
            stageEl.style.height = `${h}px`;
            stageEl.style.setProperty('--ui-scale', String(w / 640));
            const anchor = corner === 'top-right' || corner === 'bottom-left' || corner === 'bottom-right'
                ? corner
                : 'top-left';
            stageEl.classList.toggle('anchor-top-left', anchor === 'top-left');
            stageEl.classList.toggle('anchor-top-right', anchor === 'top-right');
            stageEl.classList.toggle('anchor-bottom-left', anchor === 'bottom-left');
            stageEl.classList.toggle('anchor-bottom-right', anchor === 'bottom-right');
            syncRendererSize();
        }

        function syncRendererSize() {
            const w = canvasW || 640;
            const h = canvasH || 480;
            camera.aspect = w / Math.max(1, h);
            camera.updateProjectionMatrix();
            renderer.setPixelRatio(1);
            renderer.setSize(w, h);
        }

        function setOverlayVisible(on) {
            overlayOn = on;
            document.documentElement.classList.toggle('paused', !on);
            renderer.domElement.style.opacity = on ? '1' : '0';
            if (on) {
                startLoop();
            } else {
                stopLoop();
            }
        }

        function startLoop() {
            if (rafId) {
                return;
            }
            clock.getDelta();
            rafId = requestAnimationFrame(tick);
        }

        function stopLoop() {
            if (!rafId) {
                return;
            }
            cancelAnimationFrame(rafId);
            rafId = 0;
        }

        function startLevelTransition(state, died = false) {
            transitioning = true;
            pendingState = state;
            transitionMsgEl.textContent = died ? 'You died' : `Entering Level ${state.floor}`;
            transitionEl.classList.remove('title');
            transitionEl.classList.add('out');

            window.setTimeout(() => {
                const next = pendingState || state;
                commitWorld(next, true);
                shownFloor = Number(next.floor);
                shownWorldId = Number(next.worldId) || 0;
                transitionEl.classList.add('title');
            }, 500);

            window.setTimeout(() => {
                transitionEl.classList.remove('out', 'title');
            }, 2000);

            window.setTimeout(() => {
                transitioning = false;
                const next = pendingState;
                pendingState = null;
                if (next) {
                    applyState(next, false);
                }
            }, 2550);
        }

        function commitWorld(state, snap) {
            const key = `${state.worldId ?? 0}:${state.floor}:${state.width}:${state.height}`;
            if (key !== mazeKey) {
                mazeKey = key;
                rebuildMaze(state);
                snap = true;
            }

            const player = state.player;
            targetPos.set(player.x * CELL, EYE, player.y * CELL);
            targetYaw = YAWS[player.dir] ?? 0;
            if (snap) {
                camPos.copy(targetPos);
                camYaw = targetYaw;
                bump = 0;
            }

            if (state.exit) {
                exitMesh.position.set(state.exit.x, 0, state.exit.y);
                exitTarget.position.set(state.exit.x, 0, state.exit.y);
                exitSpot.position.set(state.exit.x, WALL_H - 0.04, state.exit.y);
            }

            if (state.at && state.at !== lastAt && state.lastAction?.bumped) {
                bump = state.lastAction.command === 'down' ? -0.14 : 0.14;
            }
            lastAt = state.at || lastAt;

            floorEl.textContent = String(state.floor ?? 0);
            updateHpBar(state);
            flashHurt(state);
            syncEnemies(state, snap);
            const autoplaying = state.mode === 'autoplay';
            modeNameEl.textContent = state.mode === 'democracy' ? 'Democracy' : autoplaying ? 'Autoplay' : 'Anarchy';
            modeHintEl.textContent = autoplaying ? 'Chat !up to take over' : '';
            modeEl.classList.toggle('democracy', state.mode === 'democracy');
            modeEl.classList.toggle('autoplay', autoplaying);
            hudEl.classList.toggle('autoplay', autoplaying);
            helpEl.textContent = autoplaying ? 'Autoplay · !up to take over' : '!up !down !left !right !fire';

            const action = state.lastAction;
            if (autoplaying && action?.user === 'autoplay') {
                lastEl.innerHTML = action.command === 'fire'
                    ? `Autoplay <span>!fire</span>`
                    : `Autoplay <span>walking</span>`;
            } else if (action?.displayName) {
                const extra = action.vote
                    ? ' · voting'
                    : action.command === 'fire'
                      ? ' · fire staff'
                      : action.bumped
                        ? ' · wall'
                        : '';
                lastEl.innerHTML = `${escapeHtml(action.displayName)} <span>!${escapeHtml(action.command)}${extra}</span>`;
            } else {
                lastEl.innerHTML = '<span>Waiting for chat</span>';
            }

            if (action?.command === 'fire' && action.shot && action.shotId) {
                if (snap) {
                    lastShotId = action.shotId;
                } else if (action.shotId !== lastShotId) {
                    lastShotId = action.shotId;
                    spawnFireBolt(action.shot);
                }
            }

            const voting = state.mode === 'democracy' && state.votes;
            votesEl.classList.toggle('open', Boolean(voting));
            voteEndsAt = voting && state.voteEndsAt ? Date.parse(state.voteEndsAt) : 0;
            if (voting) {
                const total = Math.max(1, Object.values(state.votes).reduce((sum, n) => sum + n, 0));
                for (const command of ['up', 'down', 'left', 'right']) {
                    const n = state.votes[command] || 0;
                    document.getElementById(`n-${command}`).textContent = String(n);
                    document.getElementById(`bar-${command}`).style.width = `${(n / total) * 100}%`;
                }
            }
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function tick() {
            if (!overlayOn) {
                rafId = 0;
                return;
            }
            rafId = requestAnimationFrame(tick);
            const dt = clock.getDelta();
            fpsFrames += 1;
            fpsElapsed += dt;
            if (fpsElapsed >= 0.5) {
                fpsEl.textContent = `${Math.round(fpsFrames / fpsElapsed)} fps`;
                fpsFrames = 0;
                fpsElapsed = 0;
            }
            const moveT = 1 - Math.exp(-dt * MOVE_LERP);
            const snapT = 1 - Math.exp(-dt * SNAP_LERP);
            camPos.lerp(targetPos, moveT);
            camYaw = lerpAngle(camYaw, targetYaw, moveT);
            bump *= Math.exp(-dt * SNAP_LERP);
            updateEnemies(dt, moveT);
            for (const door of doorHinges) {
                const nearby = Math.max(Math.abs(door.x - targetPos.x), Math.abs(door.z - targetPos.z)) <= 1.01;
                const want = nearby ? DOOR_OPEN : DOOR_CLOSED;
                door.hinge.rotation.y += (want - door.hinge.rotation.y) * snapT;
            }

            const bob = Math.sin(clock.elapsedTime * 2.1) * 0.018;
            const lookX = -Math.sin(camYaw);
            const lookZ = -Math.cos(camYaw);
            camera.position.set(
                camPos.x + lookX * bump,
                camPos.y + bob,
                camPos.z + lookZ * bump,
            );
            camera.rotation.y = camYaw;
            staffKick *= Math.exp(-dt * 11);
            staff.position.y = staffBasePos.y + bob * 0.35;
            staff.rotation.x = staffBaseRot.x - staffKick * 0.42;
            staff.rotation.z = staffBaseRot.z - staffKick * 0.14;
            staffCrystalMat.emissiveIntensity = 1.55 + staffKick * 2.4 + Math.sin(clock.elapsedTime * 9) * 0.28;
            staffLight.intensity = 0.55 + staffKick * 1.8 + Math.sin(clock.elapsedTime * 13) * 0.12;
            staffGlow.scale.setScalar(1 + staffKick * 0.35 + Math.sin(clock.elapsedTime * 11) * 0.08);
            updateFx(dt);
            torch.intensity = 1.6 + Math.sin(clock.elapsedTime * 11) * 0.12;
            torchFlameMat.emissiveIntensity = 2.1 + Math.sin(clock.elapsedTime * 17) * 0.45 + Math.sin(clock.elapsedTime * 29) * 0.2;
            updateTorchEmbers(dt);
            updateMushroomSpores(dt);
            const pulse = 0.72 + Math.sin(clock.elapsedTime * 1.6) * 0.1;
            for (const water of waterMeshes) {
                water.material.opacity = pulse;
                water.material.emissiveIntensity = 0.4 + Math.sin(clock.elapsedTime * 1.8) * 0.12;
            }
            for (let i = 0; i < windowLights.length; i++) {
                const light = windowLights[i];
                light.intensity = (light.userData.base || 2.6) * (0.85 + Math.sin(clock.elapsedTime * 0.7 + i) * 0.12);
            }
            for (let i = 0; i < torchLights.length; i++) {
                const light = torchLights[i];
                const flicker = Math.sin(clock.elapsedTime * 14 + i * 1.7) * 0.12 + Math.sin(clock.elapsedTime * 23 + i) * 0.06;
                light.intensity = light.userData.base * (1 + flicker);
            }
            goldMat.emissiveIntensity = 0.45 + Math.sin(clock.elapsedTime * 3) * 0.18;
            exitCrown.rotation.y = clock.elapsedTime * 0.7;
            const beamPulse = 0.5 + 0.5 * Math.sin(clock.elapsedTime * 2.4);
            exitSpot.intensity = 24 + beamPulse * 8;
            exitBeam.material.opacity = 0.14 + beamPulse * 0.08;
            exitBeamCore.material.opacity = 0.22 + beamPulse * 0.12;
            updateArtworkClips(dt);

            if (voteEndsAt) {
                const left = Math.max(0, (voteEndsAt - Date.now()) / 1000);
                voteTitleEl.textContent = `Democracy · ${left.toFixed(1)}s`;
            }

            renderer.render(scene, camera);
        }

        addEventListener('resize', () => {
            syncRendererSize();
        });

        fetch('/api/dungeon')
            .then((res) => res.json())
            .then((state) => applyState(state, true))
            .catch(() => {
                lastEl.innerHTML = '<span>Could not load dungeon</span>';
            });

        const source = new EventSource('/api/dungeon/events');
        source.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'state' || data.grid) {
                applyState(data, false);
            }
        };

        if (preview) {
            let next = 'up';
            const send = async () => {
                if (!overlayOn) {
                    return;
                }
                try {
                    const res = await fetch('/api/dungeon/input', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ command: next, user: 'preview', displayName: 'preview' }),
                    });
                    const state = await res.json();
                    if (state.bumped || state.lastAction?.bumped) {
                        next = Math.random() < 0.5 ? 'left' : 'right';
                    } else if (state.lastAction?.command === 'left' || state.lastAction?.command === 'right') {
                        next = 'up';
                    } else if (Math.random() < 0.12) {
                        next = Math.random() < 0.5 ? 'left' : 'right';
                    } else {
                        next = 'up';
                    }
                } catch {
                    next = 'up';
                }
            };
            send();
            setInterval(send, 800);
        }

        startLoop();
    </script>
</body>
</html>
