<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>teerzobot dungeon</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #090807;
            overflow: hidden;
            color: #fff;
            font: clamp(13px, 2.4vw, 16px)/1.3 "Trebuchet MS", "Segoe UI", sans-serif;
        }
        canvas {
            display: block;
        }
        #hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
            text-shadow: 0 1px 2px #000, 0 0 8px #000;
        }
        #top {
            position: absolute;
            top: clamp(6px, 3.2vh, 18px);
            left: clamp(8px, 2.4vw, 20px);
            right: clamp(8px, 2.4vw, 20px);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }
        #floor, #mode, #last, #votes {
            background: rgba(0, 0, 0, 0.62);
            border-radius: 8px;
        }
        #floor {
            padding: 6px 10px;
            font-size: 0.9em;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        #floor strong {
            display: block;
            font-size: clamp(18px, 3.8vw, 24px);
            letter-spacing: 0.02em;
            font-weight: 700;
        }
        #mode {
            padding: 6px 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.95em;
            font-weight: 700;
            background: rgba(180, 40, 28, 0.78);
        }
        #mode.democracy {
            background: rgba(20, 90, 160, 0.82);
        }
        #last {
            position: absolute;
            left: clamp(8px, 2.4vw, 20px);
            bottom: clamp(8px, 4vh, 22px);
            font-size: clamp(15px, 2.8vw, 20px);
            font-weight: 700;
            max-width: 54%;
            padding: 6px 10px;
        }
        #last span {
            opacity: 0.92;
            font-weight: 700;
            font-size: 0.88em;
        }
        #votes {
            position: absolute;
            right: clamp(8px, 2.4vw, 20px);
            bottom: clamp(8px, 3.6vh, 20px);
            width: min(240px, 38vw);
            padding: clamp(6px, 1.4vh, 12px) clamp(8px, 1.2vw, 14px);
            display: none;
        }
        #votes.open {
            display: block;
        }
        #votes h2 {
            margin: 0 0 0.4em;
            font-size: 0.8em;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .vote {
            display: grid;
            grid-template-columns: 2.8em 1fr 1.5em;
            gap: 6px;
            align-items: center;
            margin-top: 4px;
            font-size: 0.95em;
            font-weight: 700;
        }
        .bar {
            height: clamp(6px, 1.4vh, 8px);
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.18);
            overflow: hidden;
        }
        .bar i {
            display: block;
            height: 100%;
            width: 0;
            background: #7ce0ff;
            transition: width 0.2s ease;
        }
        #vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, 0.55) 100%);
        }
        #help {
            position: absolute;
            top: clamp(6px, 3.2vh, 18px);
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.9;
            font-size: 0.85em;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            white-space: nowrap;
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.62);
        }
        @media (max-width: 680px), (max-height: 500px) {
            html, body { font-size: 16px; }
            #help { display: none; }
            #top {
                top: 8px;
                left: 8px;
                right: 8px;
            }
            #floor { font-size: 13px; padding: 7px 10px; }
            #floor strong { font-size: 22px; }
            #mode { font-size: 14px; padding: 8px 12px; }
            #last {
                left: 8px;
                bottom: 8px;
                max-width: calc(100% - 16px);
                font-size: 18px;
                padding: 8px 12px;
            }
            #votes {
                right: 8px;
                bottom: 52px;
                width: min(230px, calc(100% - 16px));
                font-size: 15px;
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <div id="hud">
        <div id="vignette"></div>
        <div id="top">
            <div id="floor">Floor<br><strong>1</strong></div>
            <div id="mode">Anarchy</div>
        </div>
        <div id="help">!up !down !left !right</div>
        <div id="last"><span>Waiting for chat</span></div>
        <div id="votes">
            <h2 id="vote-title">Democracy</h2>
            <div class="vote"><span>!up</span><div class="bar"><i id="bar-up"></i></div><b id="n-up">0</b></div>
            <div class="vote"><span>!down</span><div class="bar"><i id="bar-down"></i></div><b id="n-down">0</b></div>
            <div class="vote"><span>!left</span><div class="bar"><i id="bar-left"></i></div><b id="n-left">0</b></div>
            <div class="vote"><span>!right</span><div class="bar"><i id="bar-right"></i></div><b id="n-right">0</b></div>
        </div>
    </div>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js';

        const params = new URLSearchParams(location.search);
        const preview = params.has('preview');
        const CELL = 1;
        const EYE = 0.52;
        const WALL_H = 1.55;
        const YAWS = [0, -Math.PI / 2, Math.PI, Math.PI / 2];

        const floorEl = document.querySelector('#floor strong');
        const modeEl = document.getElementById('mode');
        const lastEl = document.getElementById('last');
        const votesEl = document.getElementById('votes');
        const voteTitleEl = document.getElementById('vote-title');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x090807);
        scene.fog = new THREE.FogExp2(0x090807, 0.42);

        const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 80);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.BasicShadowMap;
        document.body.prepend(renderer.domElement);

        const ambient = new THREE.AmbientLight(0x2a241c, 0.4);
        scene.add(ambient);
        const torch = new THREE.PointLight(0xffd6a0, 2.4, 8, 1.6);
        camera.add(torch);
        scene.add(camera);

        const EXIT_R = 0.22;
        const exitMesh = new THREE.Mesh(
            new THREE.SphereGeometry(EXIT_R, 20, 16),
            new THREE.MeshStandardMaterial({
                color: 0xd01414,
                emissive: 0x7a0000,
                emissiveIntensity: 0.7,
                roughness: 0.35,
                metalness: 0.05,
            }),
        );
        exitMesh.castShadow = true;
        scene.add(exitMesh);

        const exitSpot = new THREE.SpotLight(0xff2a22, 32, 6.5, Math.PI / 6, 0.35, 1.15);
        exitSpot.castShadow = true;
        exitSpot.shadow.mapSize.set(256, 256);
        exitSpot.shadow.camera.near = 0.1;
        exitSpot.shadow.camera.far = 7;
        const exitTarget = new THREE.Object3D();
        exitSpot.target = exitTarget;
        scene.add(exitSpot);
        scene.add(exitTarget);

        function makeStoneCanvas() {
            const size = 32;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2a2622';
            ctx.fillRect(0, 0, size, size);

            const palettes = [
                [118, 104, 90],
                [96, 86, 74],
                [132, 116, 98],
                [84, 76, 66],
                [108, 96, 82],
                [124, 112, 96],
                [90, 82, 70],
            ];
            const brickW = 16;
            const brickH = 8;
            const grout = 1;

            function paintBrick(x, y, pal, seed) {
                const shade = 0.82 + (seed % 8) * 0.03;
                const r = Math.min(255, pal[0] * shade);
                const g = Math.min(255, pal[1] * shade);
                const b = Math.min(255, pal[2] * shade);
                for (const ox of [0, size, -size]) {
                    for (const oy of [0, size, -size]) {
                        const dx = x + ox;
                        const dy = y + oy;
                        if (dx >= size || dy >= size || dx + brickW - grout <= 0 || dy + brickH - grout <= 0) {
                            continue;
                        }
                        ctx.fillStyle = `rgb(${r | 0},${g | 0},${b | 0})`;
                        ctx.fillRect(dx + grout, dy + grout, brickW - grout, brickH - grout);
                        ctx.fillStyle = 'rgba(0,0,0,0.18)';
                        ctx.fillRect(dx + grout, dy + brickH - 1, brickW - grout, 1);
                        ctx.fillStyle = 'rgba(255,255,255,0.08)';
                        ctx.fillRect(dx + grout, dy + grout, brickW - grout, 1);
                    }
                }
            }

            let row = 0;
            for (let y = 0; y < size; y += brickH) {
                const offset = (row % 2) * (brickW / 2);
                for (let x = -offset; x < size; x += brickW) {
                    const seed = Math.abs((x * 13 + y * 7 + row * 17) | 0);
                    paintBrick(x, y, palettes[seed % palettes.length], seed);
                }
                row += 1;
            }

            const img = ctx.getImageData(0, 0, size, size);
            for (let i = 0; i < img.data.length; i += 4) {
                const n = ((i * 17) % 9) - 4;
                img.data[i] = Math.max(0, Math.min(255, img.data[i] + n));
                img.data[i + 1] = Math.max(0, Math.min(255, img.data[i + 1] + n));
                img.data[i + 2] = Math.max(0, Math.min(255, img.data[i + 2] + n));
            }
            ctx.putImageData(img, 0, 0);
            return canvas;
        }

        function drawVines(ctx, size) {
            const stems = ['#1d4a1a', '#245820', '#2f6b28'];
            const leaves = ['#2e6e28', '#3d8a32', '#52a83e', '#6cbc4a'];

            function px(x, y, color) {
                const dx = ((x % size) + size) % size;
                if (y < 0 || y >= size) {
                    return;
                }
                ctx.fillStyle = color;
                ctx.fillRect(dx, y, 1, 1);
            }

            function leaf(x, y, seed) {
                px(x, y, leaves[seed % leaves.length]);
                if (seed % 2 === 0) {
                    px(x + 1, y, leaves[(seed + 1) % leaves.length]);
                }
                if (seed % 3 !== 1) {
                    px(x, y + 1, leaves[(seed + 2) % leaves.length]);
                }
                if (seed % 4 === 0) {
                    px(x - 1, y, '#245820');
                }
                if (seed % 5 === 0) {
                    px(x + 1, y - 1, '#7ad055');
                }
            }

            const vines = [
                { x: 3, lean: 1, len: 32 },
                { x: 11, lean: -1, len: 26 },
                { x: 18, lean: 1, len: 30 },
                { x: 27, lean: -1, len: 22 },
            ];
            for (const vine of vines) {
                let x = vine.x;
                for (let y = 0; y < vine.len; y++) {
                    px(x, y, stems[(x + y) % stems.length]);
                    px(x, y + 1, stems[(x + y + 1) % stems.length]);
                    if ((y + vine.x) % 3 === 0) {
                        leaf(x + vine.lean, y, x * 5 + y);
                    }
                    if ((y + vine.x) % 4 === 0) {
                        leaf(x - vine.lean, y + 1, y * 7 + vine.x);
                    }
                    if (y > 2 && (y * 3 + vine.x) % 5 === 0) {
                        x += vine.lean;
                    }
                }
            }

            for (let i = 0; i < 10; i++) {
                leaf(4 + ((i * 11) % 24), 2 + ((i * 5) % 8), i * 13);
            }
        }

        function canvasToTexture(canvas) {
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.repeat.set(1, 2);
            tex.needsUpdate = true;
            return tex;
        }

        function makeVineCanvas() {
            const canvas = makeStoneCanvas();
            drawVines(canvas.getContext('2d'), canvas.width);
            return canvas;
        }

        const floorMat = new THREE.MeshLambertMaterial({ color: 0x1b1713 });
        const ceilMat = new THREE.MeshLambertMaterial({ color: 0x100e0c });
        const wallMat = new THREE.MeshLambertMaterial({ map: canvasToTexture(makeStoneCanvas()) });
        const vineWallMat = new THREE.MeshLambertMaterial({ map: canvasToTexture(makeVineCanvas()) });
        let floorMesh = null;
        let ceilMesh = null;
        let wallMesh = null;
        let vineWallMesh = null;
        let mazeKey = '';

        const camPos = new THREE.Vector3(1, EYE, 1);
        const targetPos = new THREE.Vector3(1, EYE, 1);
        let camYaw = 0;
        let targetYaw = 0;
        let bump = 0;
        let lastAt = '';
        let voteEndsAt = 0;
        const clock = new THREE.Clock();

        function lerpAngle(a, b, t) {
            let diff = b - a;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            return a + diff * t;
        }

        function disposeMesh(mesh) {
            if (!mesh) {
                return;
            }
            scene.remove(mesh);
            mesh.geometry.dispose();
        }

        function rebuildMaze(state) {
            disposeMesh(floorMesh);
            disposeMesh(ceilMesh);
            disposeMesh(wallMesh);
            disposeMesh(vineWallMesh);

            const w = state.width;
            const h = state.height;
            const floorGeo = new THREE.PlaneGeometry(w * CELL, h * CELL);
            floorGeo.rotateX(-Math.PI / 2);
            floorMesh = new THREE.Mesh(floorGeo, floorMat);
            floorMesh.position.set((w - 1) / 2, 0, (h - 1) / 2);
            scene.add(floorMesh);

            const ceilGeo = new THREE.PlaneGeometry(w * CELL, h * CELL);
            ceilGeo.rotateX(Math.PI / 2);
            ceilMesh = new THREE.Mesh(ceilGeo, ceilMat);
            ceilMesh.position.set((w - 1) / 2, WALL_H, (h - 1) / 2);
            scene.add(ceilMesh);

            const stoneWalls = [];
            const vineWalls = [];
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (state.grid[y][x] !== 1) {
                        continue;
                    }
                    if ((x * 7 + y * 13) % 4 === 0) {
                        vineWalls.push(x, y);
                    } else {
                        stoneWalls.push(x, y);
                    }
                }
            }

            function buildWalls(positions, material) {
                const count = positions.length / 2 || 1;
                const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1.02, WALL_H, 1.02), material, count);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                const dummy = new THREE.Object3D();
                const color = new THREE.Color();
                for (let i = 0; i < positions.length; i += 2) {
                    const index = i / 2;
                    dummy.position.set(positions[i], WALL_H / 2, positions[i + 1]);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(index, dummy.matrix);
                    const shade = 0.88 + ((positions[i] * 13 + positions[i + 1] * 7) % 9) * 0.015;
                    color.setRGB(shade, shade, shade);
                    mesh.setColorAt(index, color);
                }
                mesh.instanceMatrix.needsUpdate = true;
                if (mesh.instanceColor) {
                    mesh.instanceColor.needsUpdate = true;
                }
                scene.add(mesh);
                return mesh;
            }

            wallMesh = stoneWalls.length ? buildWalls(stoneWalls, wallMat) : null;
            vineWallMesh = vineWalls.length ? buildWalls(vineWalls, vineWallMat) : null;
            floorMesh.receiveShadow = true;
        }

        function applyState(state, snap) {
            if (!state?.grid?.length) {
                return;
            }
            const key = `${state.floor}:${state.width}:${state.height}`;
            if (key !== mazeKey) {
                mazeKey = key;
                rebuildMaze(state);
                snap = true;
            }

            const player = state.player;
            targetPos.set(player.x * CELL, EYE, player.y * CELL);
            targetYaw = YAWS[player.dir] ?? 0;
            if (snap) {
                camPos.copy(targetPos);
                camYaw = targetYaw;
                bump = 0;
            }

            if (state.exit) {
                exitMesh.position.set(state.exit.x, EXIT_R, state.exit.y);
                exitTarget.position.set(state.exit.x, 0, state.exit.y);
                exitSpot.position.set(state.exit.x, WALL_H - 0.04, state.exit.y);
            }

            if (state.at && state.at !== lastAt && state.lastAction?.bumped) {
                bump = state.lastAction.command === 'down' ? -0.14 : 0.14;
            }
            lastAt = state.at || lastAt;

            floorEl.textContent = String(state.floor ?? 1);
            modeEl.textContent = state.mode === 'democracy' ? 'Democracy' : 'Anarchy';
            modeEl.classList.toggle('democracy', state.mode === 'democracy');

            const action = state.lastAction;
            if (action?.displayName) {
                const extra = action.vote ? ' · voting' : action.bumped ? ' · wall' : '';
                lastEl.innerHTML = `${escapeHtml(action.displayName)} <span>!${escapeHtml(action.command)}${extra}</span>`;
            } else {
                lastEl.innerHTML = '<span>Waiting for chat</span>';
            }

            const voting = state.mode === 'democracy' && state.votes;
            votesEl.classList.toggle('open', Boolean(voting));
            voteEndsAt = voting && state.voteEndsAt ? Date.parse(state.voteEndsAt) : 0;
            if (voting) {
                const total = Math.max(1, Object.values(state.votes).reduce((sum, n) => sum + n, 0));
                for (const command of ['up', 'down', 'left', 'right']) {
                    const n = state.votes[command] || 0;
                    document.getElementById(`n-${command}`).textContent = String(n);
                    document.getElementById(`bar-${command}`).style.width = `${(n / total) * 100}%`;
                }
            }
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function tick() {
            const dt = clock.getDelta();
            const t = 1 - Math.exp(-dt * 9);
            camPos.lerp(targetPos, t);
            camYaw = lerpAngle(camYaw, targetYaw, t);
            bump *= Math.exp(-dt * 9);

            const bob = Math.sin(clock.elapsedTime * 2.1) * 0.018;
            const lookX = -Math.sin(camYaw);
            const lookZ = -Math.cos(camYaw);
            camera.position.set(
                camPos.x + lookX * bump,
                camPos.y + bob,
                camPos.z + lookZ * bump,
            );
            camera.rotation.y = camYaw;
            torch.intensity = 2.2 + Math.sin(clock.elapsedTime * 11) * 0.18;
            exitMesh.material.emissiveIntensity = 0.55 + Math.sin(clock.elapsedTime * 3) * 0.2;
            exitSpot.intensity = 28 + Math.sin(clock.elapsedTime * 2.4) * 4;

            if (voteEndsAt) {
                const left = Math.max(0, (voteEndsAt - Date.now()) / 1000);
                voteTitleEl.textContent = `Democracy · ${left.toFixed(1)}s`;
            }

            renderer.render(scene, camera);
            requestAnimationFrame(tick);
        }

        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        fetch('/api/dungeon')
            .then((res) => res.json())
            .then((state) => applyState(state, true))
            .catch(() => {
                lastEl.innerHTML = '<span>Could not load dungeon</span>';
            });

        const source = new EventSource('/api/dungeon/events');
        source.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'state' || data.grid) {
                applyState(data, false);
            }
        };

        if (preview) {
            let next = 'up';
            const send = async () => {
                try {
                    const res = await fetch('/api/dungeon/input', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ command: next, user: 'preview', displayName: 'preview' }),
                    });
                    const state = await res.json();
                    if (state.bumped || state.lastAction?.bumped) {
                        next = Math.random() < 0.5 ? 'left' : 'right';
                    } else if (state.lastAction?.command === 'left' || state.lastAction?.command === 'right') {
                        next = 'up';
                    } else if (Math.random() < 0.12) {
                        next = Math.random() < 0.5 ? 'left' : 'right';
                    } else {
                        next = 'up';
                    }
                } catch {
                    next = 'up';
                }
            };
            send();
            setInterval(send, 800);
        }

        tick();
    </script>
</body>
</html>
