<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>teerzobot chat</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }
        #wrap {
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 12px;
            font: 18px/1.35 sans-serif;
            color: #fff;
            overflow: hidden;
        }
        #status {
            flex-shrink: 0;
            margin-bottom: 8px;
            font-size: 14px;
        }
        #messages {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column-reverse;
            gap: 6px;
            overflow: hidden;
        }
        .msg {
            word-wrap: break-word;
        }
        .name {
            font-weight: 700;
            margin-right: 6px;
        }
        .name.broadcaster { color: #ff6b6b; }
        .name.mod { color: #7cff9a; }
        .name.bot { color: #8ab4ff; }
        .emote {
            height: 1.4em;
            width: auto;
            vertical-align: middle;
            margin: 0 0.05em;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <div id="status">teerzobot chat — connecting…</div>
        <div id="messages"></div>
    </div>
    <script>
        const MAX = 40;
        const statusEl = document.getElementById('status');
        const listEl = document.getElementById('messages');

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function nameClass(data) {
            if (data.isBot) {
                return 'name bot';
            }
            if (data.isBroadcaster) {
                return 'name broadcaster';
            }
            if (data.isMod) {
                return 'name mod';
            }
            return 'name';
        }

        function renderText(data) {
            if (!Array.isArray(data.parts) || data.parts.length === 0) {
                return escapeHtml(data.text);
            }

            return data.parts.map((part) => {
                if (part.type === 'emote' && part.url) {
                    return `<img class="emote" src="${escapeHtml(part.url)}" alt="${escapeHtml(part.name)}" title="${escapeHtml(part.name)}">`;
                }
                return escapeHtml(part.text ?? '');
            }).join('');
        }

        function addMessage(data) {
            const row = document.createElement('div');
            row.className = 'msg';
            if (data.messageId) {
                row.dataset.id = data.messageId;
            }
            if (data.user) {
                row.dataset.user = String(data.user).toLowerCase();
            }
            row.innerHTML =
                `<span class="${nameClass(data)}">${escapeHtml(data.displayName || data.user)}</span>` +
                `<span>${renderText(data)}</span>`;
            listEl.prepend(row);
            while (listEl.children.length > MAX) {
                listEl.removeChild(listEl.lastChild);
            }
        }

        function removeMessage(messageId) {
            if (!messageId) {
                return;
            }
            for (const row of [...listEl.children]) {
                if (row.dataset.id === messageId) {
                    row.remove();
                    return;
                }
            }
        }

        function removeUserMessages(user) {
            if (!user) {
                return;
            }
            const login = String(user).toLowerCase();
            for (const row of [...listEl.children]) {
                if (row.dataset.user === login) {
                    row.remove();
                }
            }
        }

        function clearMessages() {
            listEl.replaceChildren();
        }

        const source = new EventSource('/api/chat/events');
        source.onopen = () => {
            statusEl.textContent = 'teerzobot chat — connected';
        };
        source.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'chat' && data.text) {
                addMessage(data);
                return;
            }
            if (data.type === 'chat-delete') {
                removeMessage(data.messageId);
                return;
            }
            if (data.type === 'chat-user-clear') {
                removeUserMessages(data.user);
                return;
            }
            if (data.type === 'chat-clear') {
                clearMessages();
            }
        };
        source.onerror = () => {
            statusEl.textContent = 'teerzobot chat — reconnecting…';
        };
    </script>
</body>
</html>
